<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>네트워크 관리사 CBT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">NETWORK MANAGER EXAM</p>
      <h1>네트워크 관리사 CBT</h1>
      <p>문제를 풀고, 틀린 문제만 다시 공부해보세요.</p><button id="theme-button" class="theme-button">다크모드</button>
    </header>

    <section id="start" class="card start-card">
      <label for="exam-select">시험 선택</label>
      <select id="exam-select" aria-label="시험 선택"><option value="network-manager-2">네트워크관리사 2급</option></select>
      <div class="stats"><span>전체 문제 <b id="total-count">0</b>개</span><span>누적 풀이 <b id="solved-count">0</b>회</span></div>
      <h2>어떻게 공부할까요?</h2>
      <div class="mode-list">
        <label class="mode-option"><input type="radio" name="solve-mode" value="practice" checked><span><b>한 문제씩 풀기</b><small>정답과 해설을 바로 확인해요</small></span></label>
        <label class="mode-option"><input type="radio" name="solve-mode" value="exam"><span><b>전체 풀고 정답 맞추기</b><small>시험처럼 끝까지 푼 뒤 한 번에 채점해요</small></span></label>
      </div>
      <h2>과목을 선택하세요</h2>
      <div id="subjects" class="subject-list"></div>
      <div class="option-row"><label for="question-count">문제 수</label><select id="question-count"><option value="all">전체 문제</option><option value="10">10문제</option><option value="20">20문제</option></select></div>
      <button id="start-button" class="primary">문제 풀기</button>
      <button id="browse-button" class="secondary full-button">과목별 문제 모아보기</button>
      <button id="wrong-button" class="secondary full-button">오답노트 보기</button>
      <p id="wrong-hint" class="hint"></p>
    </section>

    <section id="browse" class="card hidden"><div class="section-heading"><div><p class="eyebrow">QUESTION BANK</p><h2>과목별 문제 모아보기</h2></div><button id="browse-home" class="text-button">처음으로</button></div><div id="question-bank"></div></section>
    <section id="wrong" class="card hidden"><div class="section-heading"><div><p class="eyebrow">WRONG ANSWERS</p><h2>오답노트</h2></div><button id="wrong-home" class="text-button">처음으로</button></div><div id="wrong-bank"></div></section>

    <section id="quiz" class="hidden">
      <div class="quiz-top"><button id="quit-button" class="text-button">처음으로</button><span id="progress"></span></div>
      <div class="progress-bar"><i id="progress-fill"></i></div>
      <article class="card question-card">
        <div class="question-meta"><span id="category"></span><span id="number"></span></div>
        <h2 id="question"></h2>
        <div id="choices" class="choices"></div>
        <div id="explanation" class="explanation hidden"></div>
        <button id="next-button" class="primary hidden">다음 문제</button>
      </article>
    </section>

    <section id="result" class="card result-card hidden">
      <p class="eyebrow">RESULT</p>
      <h2>풀이 완료!</h2>
      <div class="score"><strong id="score">0</strong><span>점</span></div>
      <p id="result-summary"></p>
      <div class="result-actions"><button id="retry-button" class="primary">다시 풀기</button><button id="home-button" class="secondary">처음으로</button></div>
    </section>
  </main>
  <script src="questions.js"></script>
  <script src="exams.js"></script>
  <script src="app.js"></script>
</body>
</html>
