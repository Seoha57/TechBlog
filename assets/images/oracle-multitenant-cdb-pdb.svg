<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Oracle CDB와 PDB의 운영 경계</title><desc id="desc">하나의 Oracle CDB에 CDB root와 PDB seed, 여러 업무 PDB가 있으며 애플리케이션은 각 PDB service로 연결되는 구조</desc><rect width="1100" height="480" rx="28" fill="#f6fbf9"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#173d36">한 CDB 안의 공유 기반과 PDB별 업무 경계</text><text x="52" y="89" font-size="16" fill="#59766f">PDB는 애플리케이션에는 별도 DB처럼 보이지만 instance·운영 영향 일부를 공유한다</text><rect x="330" y="126" width="720" height="275" rx="24" fill="#dff1eb" stroke="#6ab29f" stroke-width="2"/><text x="365" y="166" font-size="19" font-weight="700" fill="#204f46">CDB: shared instance · control file · redo · 운영 경계</text><rect x="365" y="191" width="190" height="78" rx="16" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="460" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#204f46">CDB$ROOT</text><text x="460" y="248" text-anchor="middle" font-size="13" fill="#4d6e67">공통 metadata·common user</text><rect x="580" y="191" width="145" height="78" rx="16" fill="#fff8ec" stroke="#e7b26a" stroke-width="2"/><text x="652" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#825922">PDB$SEED</text><text x="652" y="248" text-anchor="middle" font-size="13" fill="#775d3b">새 PDB template</text><rect x="750" y="191" width="125" height="78" rx="16" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="812" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#204f46">sales PDB</text><text x="812" y="248" text-anchor="middle" font-size="13" fill="#4d6e67">local schema</text><rect x="895" y="191" width="125" height="78" rx="16" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="957" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#204f46">report PDB</text><text x="957" y="248" text-anchor="middle" font-size="13" fill="#4d6e67">local schema</text><text x="690" y="350" text-anchor="middle" font-size="15" fill="#3f6f65">PDB별 service · user · schema · tablespace · lifecycle</text><rect x="52" y="191" width="190" height="125" rx="20" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="147" y="229" text-anchor="middle" font-size="18" font-weight="700" fill="#204f46">애플리케이션</text><text x="147" y="260" text-anchor="middle" font-size="14" fill="#4d6e67">sales service</text><text x="147" y="284" text-anchor="middle" font-size="14" fill="#4d6e67">report service</text><path d="M242 253H740" stroke="#3a8274" stroke-width="3"/><path d="M740 253l-11 -7v14z" fill="#3a8274"/><text x="550" y="447" text-anchor="middle" font-size="16" font-weight="700" fill="#285c52">효율과 격리는 함께 얻지만, shared failure domain과 권한 경계를 별도로 설계해야 한다</text></g></svg>
