<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">승인 테스트 흐름</title><desc id="desc">테스트 대상의 출력이 received 파일로 저장되고 approved 파일과 비교되어 같으면 통과, 다르면 사람이 검토해 승인하거나 결함으로 처리하는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="440" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="56" font-size="26" font-weight="700" fill="#1a2f55">승인 테스트는 "기대값을 적는 일"을 "출력을 검토하는 일"로 바꾼다</text><rect x="52" y="120" width="190" height="70" rx="12" fill="#dce6f7" stroke="#6f8cc0"/><text x="147" y="162" text-anchor="middle" font-size="16" fill="#1a2f55">테스트 대상 실행</text><line x1="242" y1="155" x2="300" y2="155" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="302" y="120" width="190" height="70" rx="12" fill="#dce6f7" stroke="#6f8cc0"/><text x="397" y="150" text-anchor="middle" font-size="16" fill="#1a2f55">출력 정규화</text><text x="397" y="172" text-anchor="middle" font-size="12" fill="#546a8c">시간·ID·순서 고정</text><line x1="492" y1="155" x2="550" y2="155" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="552" y="120" width="190" height="70" rx="12" fill="#dce6f7" stroke="#6f8cc0"/><text x="647" y="150" text-anchor="middle" font-size="16" fill="#1a2f55">received 파일</text><text x="647" y="172" text-anchor="middle" font-size="12" fill="#546a8c">이번 실행 결과</text><line x1="742" y1="155" x2="800" y2="155" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="802" y="110" width="200" height="90" rx="12" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="902" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">approved와 비교</text><text x="902" y="172" text-anchor="middle" font-size="12" fill="#546a8c">Git에 커밋된 기준 파일</text><line x1="902" y1="200" x2="902" y2="250" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="560" y="255" width="190" height="70" rx="12" fill="#e3f0e0" stroke="#78a870"/><text x="655" y="286" text-anchor="middle" font-size="16" fill="#1a2f55">같다: 통과</text><text x="655" y="308" text-anchor="middle" font-size="12" fill="#546a8c">received 삭제</text><rect x="802" y="255" width="200" height="70" rx="12" fill="#fbe9e7" stroke="#d98b80"/><text x="902" y="286" text-anchor="middle" font-size="16" fill="#1a2f55">다르다: 실패</text><text x="902" y="308" text-anchor="middle" font-size="12" fill="#546a8c">diff 도구로 사람이 검토</text><line x1="902" y1="325" x2="902" y2="360" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="560" y="362" width="260" height="52" rx="12" fill="#fff" stroke="#8fa8d4"/><text x="690" y="384" text-anchor="middle" font-size="14" fill="#1a2f55">의도한 변경 → approved 갱신 후 커밋</text><text x="690" y="403" text-anchor="middle" font-size="12" fill="#546a8c">리뷰어가 diff를 함께 본다</text><rect x="840" y="362" width="200" height="52" rx="12" fill="#fff" stroke="#d98b80"/><text x="940" y="384" text-anchor="middle" font-size="14" fill="#1a2f55">의도하지 않은 변경</text><text x="940" y="403" text-anchor="middle" font-size="12" fill="#546a8c">→ 결함 수정</text></g></svg>
