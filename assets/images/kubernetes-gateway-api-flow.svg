<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes Gateway API traffic flow</title>
  <desc id="desc">GatewayClass, Gateway, HTTPRoute, and Service relationship</desc>
  <rect width="1200" height="520" rx="28" fill="#f3faf6"/>
  <text x="72" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14221d">Kubernetes Gateway API</text>
  <text x="72" y="108" font-family="Arial,sans-serif" font-size="17" fill="#648076">인프라와 애플리케이션의 라우팅 책임을 나눕니다.</text>
  <line x1="292" y1="285" x2="390" y2="285" stroke="#65ae91" stroke-width="4"/><polygon points="390,285 368,271 368,299" fill="#65ae91"/>
  <line x1="590" y1="285" x2="688" y2="285" stroke="#65ae91" stroke-width="4"/><polygon points="688,285 666,271 666,299" fill="#65ae91"/>
  <line x1="888" y1="285" x2="986" y2="285" stroke="#65ae91" stroke-width="4"/><polygon points="986,285 964,271 964,299" fill="#65ae91"/>
  <rect x="72" y="174" width="220" height="222" rx="22" fill="#fff" stroke="#a9d6c0" stroke-width="3"/>
  <rect x="390" y="174" width="200" height="222" rx="22" fill="#e0f1e8" stroke="#a9d6c0" stroke-width="3"/>
  <rect x="688" y="174" width="200" height="222" rx="22" fill="#fff" stroke="#a9d6c0" stroke-width="3"/>
  <rect x="986" y="174" width="142" height="222" rx="22" fill="#e0f1e8" stroke="#a9d6c0" stroke-width="3"/>
  <text x="104" y="230" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14221d">GatewayClass</text><text x="104" y="272" font-family="Arial,sans-serif" font-size="15" fill="#648076">컨트롤러 종류</text><text x="104" y="304" font-family="Arial,sans-serif" font-size="15" fill="#648076">인프라 운영자</text>
  <text x="422" y="230" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14221d">Gateway</text><text x="422" y="272" font-family="Arial,sans-serif" font-size="15" fill="#648076">리스너·주소</text><text x="422" y="304" font-family="Arial,sans-serif" font-size="15" fill="#648076">클러스터 운영자</text>
  <text x="720" y="230" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14221d">HTTPRoute</text><text x="720" y="272" font-family="Arial,sans-serif" font-size="15" fill="#648076">호스트·경로</text><text x="720" y="304" font-family="Arial,sans-serif" font-size="15" fill="#648076">애플리케이션 팀</text>
  <text x="1018" y="230" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14221d">Service</text><text x="1018" y="272" font-family="Arial,sans-serif" font-size="15" fill="#648076">백엔드</text>
