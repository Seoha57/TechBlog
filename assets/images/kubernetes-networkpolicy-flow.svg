<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Kubernetes NetworkPolicy의 기본 통신 제어</title><desc id="desc">frontend Pod는 api Pod로 통신하고 api Pod는 database Pod로 통신하지만 기본 거부 정책으로 그 외 통신은 막는 구조</desc><rect width="1200" height="540" fill="#fbfcfa"/><g font-family="Arial, Pretendard, sans-serif"><text x="70" y="75" font-size="30" font-weight="700" fill="#18201c">NetworkPolicy는 Pod가 누구와 통신할 수 있는지 선언합니다</text><text x="70" y="110" font-size="17" fill="#6e7972">모든 통신을 막는 기능이 아니라, 선택한 Pod의 ingress·egress 허용 범위를 정의하는 API입니다.</text><rect x="80" y="180" width="250" height="155" rx="20" fill="#e2f2e7"/><text x="120" y="239" font-size="22" font-weight="700" fill="#18201c">frontend Pod</text><text x="120" y="273" font-size="15" fill="#4d6657">사용자 요청 처리</text><path d="M330 257h120m-16-12 16 12-16 12" fill="none" stroke="#65ae91" stroke-width="4"/><text x="365" y="235" font-size="14" fill="#51705f">allow : 8080</text><rect x="470" y="180" width="250" height="155" rx="20" fill="#fff" stroke="#c5decf" stroke-width="2"/><text x="535" y="239" font-size="22" font-weight="700" fill="#18201c">api Pod</text><text x="516" y="273" font-size="15" fill="#607168">업무 API 실행</text><path d="M720 257h120m-16-12 16 12-16 12" fill="none" stroke="#65ae91" stroke-width="4"/><text x="753" y="235" font-size="14" fill="#51705f">allow : 5432</text><rect x="860" y="180" width="250" height="155" rx="20" fill="#fff7ec" stroke="#e5c98e" stroke-width="2"/><text x="900" y="239" font-size="22" font-weight="700" fill="#18201c">database Pod</text><text x="900" y="273" font-size="15" fill="#765d2e">데이터 저장소</text><line x1="80" y1="405" x2="1110" y2="405" stroke="#dfe8e1" stroke-width="2"/><text x="80" y="456" font-size="18" font-weight="700" fill="#51705f">먼저 대상 Pod를 격리하고, 필요한 방향·상대·포트만 허용한다</text></g></svg>
