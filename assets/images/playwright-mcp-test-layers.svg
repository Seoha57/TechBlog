<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400"><rect width="1200" height="400" rx="28" fill="#f3faf6"/><g font-family="Arial" fill="#14221d"><text x="70" y="70" font-size="28" font-weight="700">자동화할 시나리오를 고르는 기준</text><rect x="70" y="130" width="310" height="170" rx="20" fill="#fff" stroke="#a9d6c0" stroke-width="3"/><text x="105" y="195" font-size="22" font-weight="700">반복성</text><text x="105" y="235" font-size="16" fill="#648076">매 릴리스마다 실행되는가?</text><rect x="445" y="130" width="310" height="170" rx="20" fill="#e0f1e8" stroke="#a9d6c0" stroke-width="3"/><text x="480" y="195" font-size="22" font-weight="700">명확한 기대 결과</text><text x="480" y="235" font-size="16" fill="#648076">통과·실패를 판단할 수 있는가?</text><rect x="820" y="130" width="310" height="170" rx="20" fill="#fff" stroke="#a9d6c0" stroke-width="3"/><text x="855" y="195" font-size="22" font-weight="700">안전한 데이터</text><text x="855" y="235" font-size="16" fill="#648076">테스트 계정·환경이 있는가?</text></g></svg>
