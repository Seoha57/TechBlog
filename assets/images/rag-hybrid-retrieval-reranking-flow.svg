<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">하이브리드 RAG 검색과 reranking 흐름</title>
  <desc id="desc">질문이 BM25와 벡터 검색으로 동시에 후보를 만들고 RRF로 합친 뒤 reranker가 상위 근거를 골라 LLM에 전달하는 흐름</desc>
  <rect width="1200" height="590" rx="36" fill="#f5fbf7"/>
  <text x="72" y="78" fill="#17261f" font-family="Arial, sans-serif" font-size="30" font-weight="700">RAG는 찾기와 정렬하기를 분리한다</text>
  <text x="72" y="111" fill="#537064" font-family="Arial, sans-serif" font-size="18">1차 검색은 놓치지 않기 위해 넓게, reranking은 전달할 근거를 좁히기 위해 쓴다.</text>
  <rect x="70" y="184" width="164" height="72" rx="36" fill="#dff1e5" stroke="#6eb296" stroke-width="3"/>
  <text x="105" y="229" fill="#17261f" font-family="Arial, sans-serif" font-size="22" font-weight="700">사용자 질문</text>
  <path d="M234 220 H326 M326 220 V172 M326 220 V324" fill="none" stroke="#6eb296" stroke-width="5"/>
  <path d="M305 151 l21 21 -21 21 M305 303 l21 21 -21 21" fill="none" stroke="#6eb296" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="350" y="125" width="206" height="94" rx="18" fill="#fff" stroke="#8fc5a8" stroke-width="3"/>
  <text x="409" y="164" fill="#17261f" font-family="Arial, sans-serif" font-size="22" font-weight="700">BM25</text>
  <text x="384" y="194" fill="#537064" font-family="Arial, sans-serif" font-size="16">정확한 용어·코드</text>
  <rect x="350" y="277" width="206" height="94" rx="18" fill="#fff" stroke="#8fc5a8" stroke-width="3"/>
  <text x="386" y="316" fill="#17261f" font-family="Arial, sans-serif" font-size="22" font-weight="700">벡터 검색</text>
  <text x="391" y="346" fill="#537064" font-family="Arial, sans-serif" font-size="16">표현·의미 유사성</text>
  <path d="M556 172 H640 V248 H692 M556 324 H640 V248" fill="none" stroke="#6eb296" stroke-width="5"/>
  <path d="M671 227 l21 21 -21 21" fill="none" stroke="#6eb296" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="692" y="198" width="146" height="100" rx="18" fill="#e7f5eb" stroke="#6eb296" stroke-width="3"/>
  <text x="740" y="238" fill="#17261f" font-family="Arial, sans-serif" font-size="22" font-weight="700">RRF</text>
  <text x="714" y="268" fill="#537064" font-family="Arial, sans-serif" font-size="16">후보 순위 융합</text>
  <path d="M838 248 H906" stroke="#6eb296" stroke-width="5"/>
  <path d="M885 227 l21 21 -21 21" fill="none" stroke="#6eb296" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="906" y="176" width="198" height="144" rx="18" fill="#17261f"/>
  <text x="951" y="220" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Reranker</text>
  <path d="M935 246 H1067 M935 270 H1049 M935 294 H1029" stroke="#9ad5b6" stroke-width="7" stroke-linecap="round"/>
  <text x="934" y="354" fill="#1b4934" font-family="Arial, sans-serif" font-size="18" font-weight="700">상위 근거만 LLM에 전달</text>
  <path d="M1010 320 V410" stroke="#6eb296" stroke-width="5"/>
  <path d="M989 389 l21 21 21 -21" fill="none" stroke="#6eb296" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="902" y="430" width="216" height="78" rx="18" fill="#dff1e5" stroke="#6eb296" stroke-width="3"/>
  <text x="939" y="477" fill="#17261f" font-family="Arial, sans-serif" font-size="22" font-weight="700">근거 있는 답변</text>
</svg>
