<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">OFFSET과 Keyset 페이지네이션 비교</title><desc id="desc">OFFSET 방식은 앞선 행을 읽고 버린 뒤 반환하지만 Keyset 방식은 마지막 키 값 이후 위치에서 인덱스를 탐색해 필요한 행만 읽는 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="460" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="56" font-size="26" font-weight="700" fill="#1a2f55">페이지가 깊어질수록 OFFSET은 버리는 행이 늘고 Keyset은 시작 위치만 찾는다</text><rect x="52" y="100" width="480" height="310" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="292" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2f55">OFFSET 방식</text><text x="292" y="158" text-anchor="middle" font-size="13" fill="#546a8c">ORDER BY id LIMIT 20 OFFSET 100000</text><rect x="80" y="180" width="424" height="40" rx="8" fill="#fbe9e7" stroke="#d98b80"/><text x="292" y="205" text-anchor="middle" font-size="14" fill="#1a2f55">앞의 100,000행을 읽고 버림</text><rect x="80" y="228" width="424" height="40" rx="8" fill="#e3f0e0" stroke="#78a870"/><text x="292" y="253" text-anchor="middle" font-size="14" fill="#1a2f55">다음 20행만 반환</text><text x="292" y="305" text-anchor="middle" font-size="14" fill="#1a2f55">작업량이 OFFSET 크기에 비례해 커진다</text><text x="292" y="332" text-anchor="middle" font-size="13" fill="#546a8c">페이지 사이에 행이 추가·삭제되면 중복·누락 발생</text><text x="292" y="358" text-anchor="middle" font-size="13" fill="#546a8c">장점: 임의 페이지 번호로 바로 이동 가능</text><rect x="568" y="100" width="480" height="310" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="808" y="135" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2f55">Keyset(Seek) 방식</text><text x="808" y="158" text-anchor="middle" font-size="13" fill="#546a8c">WHERE (created_at, id) &lt; (:t, :id) ORDER BY ... LIMIT 20</text><rect x="596" y="180" width="424" height="40" rx="8" fill="#dce6f7" stroke="#6f8cc0"/><text x="808" y="205" text-anchor="middle" font-size="14" fill="#1a2f55">인덱스에서 마지막 키 위치로 직접 이동</text><rect x="596" y="228" width="424" height="40" rx="8" fill="#e3f0e0" stroke="#78a870"/><text x="808" y="253" text-anchor="middle" font-size="14" fill="#1a2f55">그 뒤 20행만 읽고 반환</text><text x="808" y="305" text-anchor="middle" font-size="14" fill="#1a2f55">작업량이 페이지 깊이와 거의 무관하다</text><text x="808" y="332" text-anchor="middle" font-size="13" fill="#546a8c">정렬 키가 유일해야 하고 인덱스가 정렬과 맞아야 함</text><text x="808" y="358" text-anchor="middle" font-size="13" fill="#546a8c">단점: 임의 페이지 점프·전체 페이지 수 계산이 어려움</text></g></svg>
