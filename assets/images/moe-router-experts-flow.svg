<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Mixture of Experts 토큰 라우팅 구조</title><desc id="desc">트랜스포머 층의 피드포워드 블록을 여러 전문가 네트워크로 나누고, 라우터가 토큰마다 상위 2개 전문가를 골라 가중합으로 합치는 흐름과 전체 파라미터 대비 활성 파라미터의 차이</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7a4fa3"/></marker></defs><rect width="1100" height="520" rx="28" fill="#faf6fd"/><g font-family="sans-serif"><text x="52" y="56" font-size="27" font-weight="700" fill="#3a2354">MoE는 토큰마다 일부 전문가만 계산한다</text><text x="52" y="86" font-size="16" fill="#76598f">저장은 모든 전문가를, 계산은 라우터가 고른 top-k 전문가만 수행한다</text><rect x="50" y="170" width="170" height="200" rx="18" fill="#fff" stroke="#c4a6dd" stroke-width="2"/><text x="135" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#4b2d6a">입력 토큰</text><text x="135" y="245" text-anchor="middle" font-size="14" fill="#6b4f85">어텐션을 거친</text><text x="135" y="270" text-anchor="middle" font-size="14" fill="#6b4f85">은닉 벡터 x</text><text x="135" y="320" text-anchor="middle" font-size="13" fill="#82699a">토큰마다 따로 선택</text><rect x="270" y="200" width="170" height="140" rx="18" fill="#efe1fa" stroke="#a57ccb" stroke-width="2"/><text x="355" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#4b2d6a">라우터</text><text x="355" y="270" text-anchor="middle" font-size="14" fill="#6b4f85">점수 계산 → softmax</text><text x="355" y="296" text-anchor="middle" font-size="14" fill="#6b4f85">상위 2개 선택</text><text x="355" y="322" text-anchor="middle" font-size="12" fill="#82699a">작은 선형층</text><rect x="500" y="120" width="330" height="320" rx="20" fill="#fff" stroke="#c4a6dd" stroke-width="2"/><text x="665" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#4b2d6a">전문가 FFN 8개 (예시)</text><rect x="525" y="172" width="130" height="54" rx="10" fill="#e9d5f7" stroke="#7a4fa3" stroke-width="3"/><text x="590" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#4b2d6a">E1 선택</text><rect x="675" y="172" width="130" height="54" rx="10" fill="#f3ecf9"/><text x="740" y="205" text-anchor="middle" font-size="14" fill="#8a7399">E2</text><rect x="525" y="242" width="130" height="54" rx="10" fill="#f3ecf9"/><text x="590" y="275" text-anchor="middle" font-size="14" fill="#8a7399">E3</text><rect x="675" y="242" width="130" height="54" rx="10" fill="#e9d5f7" stroke="#7a4fa3" stroke-width="3"/><text x="740" y="275" text-anchor="middle" font-size="14" font-weight="700" fill="#4b2d6a">E4 선택</text><rect x="525" y="312" width="130" height="54" rx="10" fill="#f3ecf9"/><text x="590" y="345" text-anchor="middle" font-size="14" fill="#8a7399">E5</text><rect x="675" y="312" width="130" height="54" rx="10" fill="#f3ecf9"/><text x="740" y="345" text-anchor="middle" font-size="14" fill="#8a7399">E6</text><text x="665" y="406" text-anchor="middle" font-size="12" fill="#82699a">E7, E8 생략 · 선택되지 않은 전문가는 이 토큰에서 계산하지 않음</text><rect x="880" y="200" width="170" height="140" rx="18" fill="#fff" stroke="#c4a6dd" stroke-width="2"/><text x="965" y="240" text-anchor="middle" font-size="18" font-weight="700" fill="#4b2d6a">가중합</text><text x="965" y="272" text-anchor="middle" font-size="14" fill="#6b4f85">w1·E1(x)+w4·E4(x)</text><text x="965" y="298" text-anchor="middle" font-size="12" fill="#82699a">w는 라우터 점수</text><path d="M220 270H262M440 270H492M830 270H872" fill="none" stroke="#7a4fa3" stroke-width="3" marker-end="url(#a)"/><text x="550" y="478" text-anchor="middle" font-size="16" font-weight="700" fill="#4b2d6a">전체 파라미터 수와 토큰당 활성 파라미터 수는 다른 숫자다</text></g></svg>
