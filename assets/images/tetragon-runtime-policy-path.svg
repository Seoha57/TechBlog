<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Tetragon 런타임 정책의 관찰과 대응 경로</title><desc id="desc">Kubernetes Pod의 프로세스 실행, 파일 접근, 네트워크 연결 이벤트가 Linux 커널 eBPF 필터와 Tetragon 정책을 거쳐 보안 이벤트 또는 제한 조치로 이어지는 구조</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3a8274"/></marker></defs>
  <rect width="1100" height="520" rx="28" fill="#f6fbf9"/>
  <text x="54" y="60" font-family="sans-serif" font-size="28" font-weight="700" fill="#173d36">Kubernetes 런타임 행위가 정책과 만나는 지점</text>
  <text x="54" y="91" font-family="sans-serif" font-size="16" fill="#59766f">관찰 신호와 차단 조치는 같은 것이 아니다. 먼저 필요한 맥락을 수집한다.</text>
  <g font-family="sans-serif">
    <rect x="50" y="145" width="248" height="272" rx="22" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="76" y="184" font-size="18" font-weight="700" fill="#204f46">Kubernetes 워크로드</text><text x="76" y="220" font-size="15" fill="#4d6e67">namespace · Pod · container</text><line x1="76" y1="240" x2="270" y2="240" stroke="#c6e0d9"/><text x="76" y="276" font-size="16" font-weight="700" fill="#315e55">프로세스 실행</text><text x="76" y="309" font-size="16" font-weight="700" fill="#315e55">파일 접근</text><text x="76" y="342" font-size="16" font-weight="700" fill="#315e55">네트워크 연결</text><text x="76" y="381" font-size="13" fill="#59766f">이벤트만으로 의도를 확정하지 않음</text>
    <rect x="391" y="145" width="246" height="272" rx="22" fill="#dff1eb" stroke="#6ab29f" stroke-width="2"/><text x="418" y="184" font-size="18" font-weight="700" fill="#204f46">Linux 커널 · eBPF</text><text x="418" y="220" font-size="15" fill="#3f6f65">커널 hook에서 조건 필터링</text><line x1="418" y1="240" x2="610" y2="240" stroke="#8fc6b8"/><text x="418" y="276" font-size="14" fill="#3f6f65">binary · file · socket</text><text x="418" y="304" font-size="14" fill="#3f6f65">namespace · capability</text><text x="418" y="332" font-size="14" fill="#3f6f65">관련 이벤트만 user space로</text><text x="418" y="381" font-size="13" fill="#59766f">커널·권한·BTF 호환성 필요</text>
    <rect x="730" y="145" width="320" height="126" rx="22" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="756" y="184" font-size="18" font-weight="700" fill="#204f46">Tetragon TracingPolicy</text><text x="756" y="218" font-size="14" fill="#4d6e67">대상·조건·Kubernetes 맥락을 연결</text><text x="756" y="244" font-size="14" fill="#4d6e67">정책 이름과 배포 버전도 이벤트에 남김</text>
    <rect x="730" y="324" width="148" height="93" rx="18" fill="#fff8ec" stroke="#e7b26a" stroke-width="2"/><text x="804" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#825922">관찰·경보</text><text x="804" y="388" text-anchor="middle" font-size="13" fill="#775d3b">SIEM · runbook</text>
    <rect x="902" y="324" width="148" height="93" rx="18" fill="#fcebea" stroke="#d98c87" stroke-width="2"/><text x="976" y="358" text-anchor="middle" font-size="16" font-weight="700" fill="#8a3935">제한·대응</text><text x="976" y="388" text-anchor="middle" font-size="13" fill="#7e514d">좁은 범위만 검토</text>
    <path d="M298 280H382M637 280H721" fill="none" stroke="#3a8274" stroke-width="3" marker-end="url(#arrow)"/><path d="M890 271V315M976 271V315" fill="none" stroke="#3a8274" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <text x="550" y="474" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#285c52">운영 순서: 관찰 → 정상 기준 → 경보 소유자 → 좁은 범위의 제한 검토</text>
</svg>
