<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">tbPSM 저장 프로시저 호출과 SQL 엔진 전환</title><desc id="desc">클라이언트가 CALL로 저장 프로시저를 호출하면 서버의 PSM 실행기가 절차형 문장을 처리하고, SQL 문장을 만날 때마다 SQL 엔진으로 넘겨 결과를 받는다. 예외가 발생하면 EXCEPTION 블록으로 이동한다. 반복문 안의 SQL은 호출 왕복이 늘어난다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="440" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="52" font-size="25" font-weight="700" fill="#1a2f55">절차형 로직은 서버 안에서, SQL은 엔진으로 넘어가며 실행된다</text><rect x="52" y="100" width="190" height="100" rx="14" fill="#dce6f7" stroke="#6f8cc0"/><text x="147" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">클라이언트</text><text x="147" y="160" text-anchor="middle" font-size="13" fill="#1a2f55">tbSQL · 애플리케이션</text><text x="147" y="180" text-anchor="middle" font-size="13" fill="#1a2f55">CALL proc(인자)</text><line x1="242" y1="150" x2="312" y2="150" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="314" y="84" width="380" height="250" rx="16" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="504" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">서버: PSM 실행기</text><rect x="338" y="128" width="332" height="44" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="504" y="156" text-anchor="middle" font-size="14" fill="#1a2f55">DECLARE: 변수 · 커서 · 예외 선언</text><rect x="338" y="182" width="332" height="44" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="504" y="210" text-anchor="middle" font-size="14" fill="#1a2f55">BEGIN: IF · LOOP · 대입 · SQL 호출</text><rect x="338" y="236" width="332" height="44" rx="10" fill="#fdecea" stroke="#d98a80"/><text x="504" y="264" text-anchor="middle" font-size="14" fill="#1a2f55">EXCEPTION: 오류 시 이동해 처리</text><text x="504" y="308" text-anchor="middle" font-size="12" fill="#546a8c">문장 단위로 해석·실행, 컴파일 결과는 서버에 저장</text><line x1="694" y1="205" x2="764" y2="205" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><line x1="764" y1="235" x2="694" y2="235" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><text x="729" y="196" text-anchor="middle" font-size="11" fill="#546a8c">SQL</text><text x="729" y="255" text-anchor="middle" font-size="11" fill="#546a8c">결과</text><rect x="766" y="150" width="280" height="130" rx="14" fill="#e3f0e0" stroke="#78a870"/><text x="906" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">SQL 엔진</text><text x="906" y="212" text-anchor="middle" font-size="13" fill="#1a2f55">파싱 · 옵티마이저 · 실행</text><text x="906" y="236" text-anchor="middle" font-size="13" fill="#1a2f55">트랜잭션 · 락 · 버퍼</text><text x="906" y="260" text-anchor="middle" font-size="12" fill="#546a8c">LOOP 안의 SQL은 건수만큼 전환 발생</text><rect x="52" y="360" width="994" height="56" rx="12" fill="#fff8e6" stroke="#d9b45f"/><text x="549" y="384" text-anchor="middle" font-size="14" fill="#1a2f55">행 단위 LOOP보다 집합 SQL 한 문장이 전환 횟수를 줄인다 — 불가피하면 BULK COLLECT·FORALL로 묶는다</text><text x="549" y="404" text-anchor="middle" font-size="12" fill="#546a8c">효과의 크기는 환경마다 달라 직접 측정해 확인해야 한다</text></g></svg>
