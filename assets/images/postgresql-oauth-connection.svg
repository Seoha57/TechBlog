<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 485" role="img" aria-labelledby="title desc"><title id="title">PostgreSQL 18 OAuth 접속 흐름</title><desc id="desc">사용자 또는 libpq 클라이언트가 authorization server에서 access token을 얻고 PostgreSQL OAuth validator로 검증한 후 database role 권한을 받는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3a8274"/></marker></defs><rect width="1100" height="485" rx="28" fill="#f6fbf9"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#173d36">OAuth 접속은 토큰 발급과 DB 권한 검사가 이어지는 흐름이다</text><text x="52" y="90" font-size="16" fill="#59766f">토큰 검증 성공은 테이블 접근 권한까지 자동으로 부여한다는 뜻이 아니다</text><rect x="55" y="157" width="190" height="140" rx="20" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="150" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#204f46">psql · libpq</text><text x="150" y="228" text-anchor="middle" font-size="14" fill="#4d6e67">issuer·client ID</text><text x="150" y="253" text-anchor="middle" font-size="14" fill="#4d6e67">token 요청·전달</text><rect x="335" y="135" width="215" height="184" rx="20" fill="#dff1eb" stroke="#6ab29f" stroke-width="2"/><text x="442" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#204f46">Authorization Server</text><text x="442" y="210" text-anchor="middle" font-size="14" fill="#3f6f65">사용자 인증·MFA</text><text x="442" y="236" text-anchor="middle" font-size="14" fill="#3f6f65">scope 동의</text><text x="442" y="262" text-anchor="middle" font-size="14" fill="#3f6f65">access token 발급</text><rect x="640" y="135" width="205" height="184" rx="20" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="742" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#204f46">PostgreSQL</text><text x="742" y="210" text-anchor="middle" font-size="14" fill="#4d6e67">oauth HBA rule</text><text x="742" y="236" text-anchor="middle" font-size="14" fill="#4d6e67">validator: issuer·expiry</text><text x="742" y="262" text-anchor="middle" font-size="14" fill="#4d6e67">identity mapping</text><rect x="930" y="157" width="120" height="140" rx="20" fill="#fff8ec" stroke="#e7b26a" stroke-width="2"/><text x="990" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#825922">DB role</text><text x="990" y="228" text-anchor="middle" font-size="14" fill="#775d3b">GRANT</text><text x="990" y="253" text-anchor="middle" font-size="14" fill="#775d3b">RLS</text><path d="M245 226H326M550 226H631M845 226H921" stroke="#3a8274" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="290" y="210" text-anchor="middle" font-size="12" fill="#59766f">인증·동의</text><text x="590" y="210" text-anchor="middle" font-size="12" fill="#59766f">bearer token</text><text x="883" y="210" text-anchor="middle" font-size="12" fill="#59766f">인가</text><text x="550" y="399" text-anchor="middle" font-size="16" font-weight="700" fill="#285c52">TLS, 좁은 HBA 범위, 신뢰할 issuer와 validator가 함께 필요하다</text></g></svg>
