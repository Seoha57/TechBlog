<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">WireMock 서비스 가상화 구조</title><desc id="desc">운영에서는 우리 서비스가 실제 외부 API를 호출하고, 테스트에서는 접속 주소만 바꿔 WireMock 서버가 스텁 응답, 장애 주입, 요청 기록을 제공하며 테스트가 호출을 검증한다.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="440" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="52" font-size="25" font-weight="700" fill="#1a2f55">접속 주소만 바꿔 외부 API 자리에 가상 서버를 둔다</text><text x="52" y="100" font-size="15" font-weight="700" fill="#546a8c">운영</text><rect x="120" y="75" width="220" height="60" rx="12" fill="#dce6f7" stroke="#6f8cc0"/><text x="230" y="110" text-anchor="middle" font-size="15" fill="#1a2f55">우리 서비스(HTTP 클라이언트)</text><line x1="340" y1="105" x2="560" y2="105" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><text x="450" y="95" text-anchor="middle" font-size="12" fill="#546a8c">base URL = 실제 주소</text><rect x="562" y="75" width="220" height="60" rx="12" fill="#e9e9ee" stroke="#9a9aaa"/><text x="672" y="110" text-anchor="middle" font-size="15" fill="#1a2f55">실제 외부 API</text><text x="52" y="236" font-size="15" font-weight="700" fill="#546a8c">테스트</text><rect x="120" y="205" width="220" height="60" rx="12" fill="#dce6f7" stroke="#6f8cc0"/><text x="230" y="240" text-anchor="middle" font-size="15" fill="#1a2f55">같은 클라이언트 코드</text><line x1="340" y1="235" x2="560" y2="235" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><text x="450" y="225" text-anchor="middle" font-size="12" fill="#546a8c">base URL = localhost:8080</text><rect x="562" y="170" width="300" height="140" rx="14" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="712" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">WireMock 서버</text><text x="712" y="225" text-anchor="middle" font-size="13" fill="#1a2f55">① 스텁 매핑: 요청 조건 → 응답</text><text x="712" y="250" text-anchor="middle" font-size="13" fill="#1a2f55">② 장애 주입: 지연·연결 끊김·5xx</text><text x="712" y="275" text-anchor="middle" font-size="13" fill="#1a2f55">③ 상태 시나리오: 실패 후 성공</text><text x="712" y="298" text-anchor="middle" font-size="13" fill="#1a2f55">④ 요청 기록 저장</text><rect x="900" y="205" width="160" height="60" rx="12" fill="#e3f0e0" stroke="#78a870"/><text x="980" y="232" text-anchor="middle" font-size="14" fill="#1a2f55">테스트 검증</text><text x="980" y="252" text-anchor="middle" font-size="12" fill="#546a8c">호출 횟수·헤더·본문</text><line x1="862" y1="235" x2="898" y2="235" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="120" y="350" width="740" height="52" rx="12" fill="#fff8e6" stroke="#d9b45f"/><text x="490" y="373" text-anchor="middle" font-size="14" fill="#1a2f55">가짜는 "우리가 이해한 계약"이다 → 계약 테스트와 소수의 실연동 점검으로 어긋남을 감시</text><text x="490" y="391" text-anchor="middle" font-size="12" fill="#546a8c">서비스 가상화는 방어 로직 검증용, 형식 일치 보장은 별도 장치가 필요</text></g></svg>
