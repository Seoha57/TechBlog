<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">axe-core 접근성 자동 검사와 수동 검토의 경계</title><desc id="desc">브라우저 DOM에서 axe-core가 규칙을 검사하고 자동 위반과 수동 검토 항목으로 결과가 나뉘는 구조</desc><rect width="1200" height="620" rx="36" fill="#f5faf6"/><text x="72" y="88" fill="#18201c" font-family="Arial, sans-serif" font-size="34" font-weight="700">접근성 테스트는 자동 검사와 수동 검토를 함께 쓴다</text><text x="72" y="128" fill="#6e7972" font-family="Arial, sans-serif" font-size="20">axe-core는 렌더링된 DOM에서 확실히 판단할 수 있는 규칙을 찾는다.</text><rect x="72" y="202" width="270" height="220" rx="22" fill="#fff" stroke="#a8d1b5" stroke-width="3"/><text x="104" y="260" fill="#18201c" font-family="Arial, sans-serif" font-size="27" font-weight="700">브라우저 DOM</text><text x="104" y="304" fill="#586b5e" font-family="Arial, sans-serif" font-size="19">label · button</text><text x="104" y="338" fill="#586b5e" font-family="Arial, sans-serif" font-size="19">role · focus · 상태</text><text x="104" y="372" fill="#586b5e" font-family="Arial, sans-serif" font-size="19">열린 모달·오류 화면</text><path d="M365 312H465" stroke="#6aa88b" stroke-width="5"/><path d="m447 294 20 18-20 18" fill="none" stroke="#6aa88b" stroke-width="5"/><rect x="486" y="176" width="250" height="272" rx="22" fill="#e3f2e6" stroke="#76b991" stroke-width="3"/><text x="524" y="255" fill="#18201c" font-family="Arial, sans-serif" font-size="30" font-weight="700">axe-core</text><text x="524" y="300" fill="#3d7259" font-family="Arial, sans-serif" font-size="19">WCAG 태그·규칙</text><text x="524" y="336" fill="#3d7259" font-family="Arial, sans-serif" font-size="19">노드별 checks</text><text x="524" y="372" fill="#3d7259" font-family="Arial, sans-serif" font-size="19">JSON 결과</text><path d="M760 270H832" stroke="#6aa88b" stroke-width="5"/><path d="m814 252 20 18-20 18" fill="none" stroke="#6aa88b" stroke-width="5"/><path d="M760 354H832" stroke="#6aa88b" stroke-width="5"/><path d="m814 336 20 18-20 18" fill="none" stroke="#6aa88b" stroke-width="5"/><rect x="856" y="176" width="272" height="126" rx="20" fill="#fff3f1" stroke="#e6a39a" stroke-width="3"/><text x="888" y="229" fill="#8b3027" font-family="Arial, sans-serif" font-size="25" font-weight="700">violations</text><text x="888" y="267" fill="#79564f" font-family="Arial, sans-serif" font-size="18">명확한 규칙 위반 → CI·수정</text><rect x="856" y="322" width="272" height="126" rx="20" fill="#fffbe9" stroke="#dbc26c" stroke-width="3"/><text x="888" y="375" fill="#70601d" font-family="Arial, sans-serif" font-size="25" font-weight="700">incomplete</text><text x="888" y="413" fill="#716c4c" font-family="Arial, sans-serif" font-size="18">의미·흐름 판단 → 사람 검토</text><text x="72" y="534" fill="#6e7972" font-family="Arial, sans-serif" font-size="18">키보드 탐색, 대체 텍스트의 의미, 실제 스크린리더 경험은 자동 결과와 별개로 확인한다.</text></svg>
