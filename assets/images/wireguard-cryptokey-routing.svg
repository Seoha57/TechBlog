<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">WireGuard 암호키 라우팅 구조</title><desc id="desc">노트북과 서버가 각자의 개인키와 상대 공개키를 설정하고, AllowedIPs 표에 따라 평문 패킷을 암호화해 UDP로 보내고 수신 시 복호화 후 출처 주소를 검사하는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b6ea5"/></marker></defs><rect width="1100" height="520" rx="28" fill="#f4f8fc"/><g font-family="sans-serif"><text x="52" y="56" font-size="27" font-weight="700" fill="#173654">WireGuard는 공개키와 AllowedIPs 표로 길을 정한다</text><text x="52" y="86" font-size="16" fill="#51708f">송신: 목적지 IP로 피어 선택 → 암호화 / 수신: 복호화 → 출발지 IP가 허용 범위인지 검사</text><rect x="50" y="130" width="300" height="300" rx="20" fill="#fff" stroke="#8fb4d9" stroke-width="2"/><text x="200" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4a73">노트북 (wg0)</text><text x="200" y="202" text-anchor="middle" font-size="14" fill="#47698a">Address 10.8.0.2/32</text><text x="200" y="228" text-anchor="middle" font-size="14" fill="#47698a">PrivateKey (자기 것, 비공개)</text><rect x="75" y="252" width="250" height="150" rx="12" fill="#e6f0fa"/><text x="200" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4a73">Peer: 서버 공개키</text><text x="200" y="308" text-anchor="middle" font-size="13" fill="#47698a">Endpoint 203.0.113.10:51820</text><text x="200" y="334" text-anchor="middle" font-size="13" fill="#47698a">AllowedIPs 10.8.0.0/24</text><text x="200" y="360" text-anchor="middle" font-size="13" fill="#47698a">PersistentKeepalive 25</text><text x="200" y="386" text-anchor="middle" font-size="12" fill="#6a86a3">이 표가 곧 라우팅 표</text><rect x="400" y="190" width="300" height="180" rx="20" fill="#fff4e3" stroke="#e5b36a" stroke-width="2"/><text x="550" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#7a5418">공용 인터넷 (UDP)</text><text x="550" y="262" text-anchor="middle" font-size="14" fill="#7a5f33">암호화된 패킷만 이동</text><text x="550" y="288" text-anchor="middle" font-size="14" fill="#7a5f33">ChaCha20-Poly1305</text><text x="550" y="314" text-anchor="middle" font-size="14" fill="#7a5f33">핸드셰이크: Noise IK</text><text x="550" y="346" text-anchor="middle" font-size="12" fill="#8a7248">인증 안 된 패킷에는 응답하지 않음</text><rect x="750" y="130" width="300" height="300" rx="20" fill="#fff" stroke="#8fb4d9" stroke-width="2"/><text x="900" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#1f4a73">서버 (wg0)</text><text x="900" y="202" text-anchor="middle" font-size="14" fill="#47698a">Address 10.8.0.1/24</text><text x="900" y="228" text-anchor="middle" font-size="14" fill="#47698a">ListenPort 51820</text><rect x="775" y="252" width="250" height="150" rx="12" fill="#e6f0fa"/><text x="900" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#1f4a73">Peer: 노트북 공개키</text><text x="900" y="308" text-anchor="middle" font-size="13" fill="#47698a">AllowedIPs 10.8.0.2/32</text><text x="900" y="334" text-anchor="middle" font-size="13" fill="#47698a">Endpoint: 마지막 수신 주소로 갱신</text><text x="900" y="360" text-anchor="middle" font-size="13" fill="#47698a">복호화 후 출발지 IP 검사</text><text x="900" y="386" text-anchor="middle" font-size="12" fill="#6a86a3">허용 범위 밖이면 폐기</text><path d="M350 250H394M706 250H744" fill="none" stroke="#3b6ea5" stroke-width="3" marker-end="url(#a)"/><path d="M744 310H706M394 310H350" fill="none" stroke="#3b6ea5" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="550" y="470" text-anchor="middle" font-size="16" font-weight="700" fill="#1f4a73">피어의 신원은 IP 주소가 아니라 공개키이며, 주소는 로밍되면 바뀔 수 있다</text></g></svg>
