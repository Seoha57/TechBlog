<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">UUIDv4와 UUIDv7의 B-tree 삽입 위치 비교</title>
  <desc id="desc">난수 UUIDv4는 인덱스 여러 위치에 흩어지고 UUIDv7은 최근 시간 영역에 모이는 경향을 보여주는 도식</desc>
  <rect width="1000" height="430" rx="24" fill="#f4fbf9"/>
  <text x="54" y="55" font-family="sans-serif" font-size="26" font-weight="700" fill="#163b35">B-tree 삽입 위치는 키 생성 규칙의 영향을 받는다</text>
  <text x="54" y="86" font-family="sans-serif" font-size="15" fill="#54736d">실제 효과는 데이터·동시성·스토리지 조건에서 검증해야 한다</text>
  <g transform="translate(54 125)">
    <text x="0" y="0" font-family="sans-serif" font-size="20" font-weight="700" fill="#285c52">UUIDv4 · 난수 중심</text>
    <rect x="0" y="25" width="410" height="200" rx="16" fill="#fff" stroke="#acd8cd" stroke-width="2"/>
    <g fill="#e27878"><rect x="28" y="65" width="66" height="36" rx="8"/><rect x="118" y="151" width="66" height="36" rx="8"/><rect x="216" y="82" width="66" height="36" rx="8"/><rect x="318" y="140" width="66" height="36" rx="8"/></g>
    <g fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle"><text x="61" y="88">삽입</text><text x="151" y="174">삽입</text><text x="249" y="105">삽입</text><text x="351" y="163">삽입</text></g>
    <path d="M25 200H385" stroke="#86b8ac" stroke-width="3"/><path d="M25 200V45" stroke="#86b8ac" stroke-width="3"/>
    <text x="25" y="247" font-family="sans-serif" font-size="14" fill="#54736d">인덱스 페이지 여러 위치</text>
  </g>
  <g transform="translate(536 125)">
    <text x="0" y="0" font-family="sans-serif" font-size="20" font-weight="700" fill="#285c52">UUIDv7 · 시간 정렬</text>
    <rect x="0" y="25" width="410" height="200" rx="16" fill="#fff" stroke="#acd8cd" stroke-width="2"/>
    <g fill="#4db59e"><rect x="270" y="140" width="66" height="36" rx="8"/><rect x="322" y="98" width="66" height="36" rx="8"/><rect x="344" y="56" width="44" height="36" rx="8"/></g>
    <g fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle"><text x="303" y="163">과거</text><text x="355" y="121">최근</text><text x="366" y="79">신규</text></g>
    <path d="M25 200H385" stroke="#86b8ac" stroke-width="3"/><path d="M25 200V45" stroke="#86b8ac" stroke-width="3"/>
    <path d="M70 180 C180 180 250 150 366 65" fill="none" stroke="#f0a35b" stroke-width="4" stroke-dasharray="8 8"/>
    <text x="25" y="247" font-family="sans-serif" font-size="14" fill="#54736d">최근 영역에 모일 가능성</text>
  </g>
  <text x="500" y="395" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#285c52">시간 정렬은 업무 시각·커밋 순서를 보장하지 않는다</text>
</svg>
