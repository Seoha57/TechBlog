<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">LoRA 저랭크 어댑터 구조</title><desc id="desc">고정된 사전학습 가중치 W와 학습 가능한 작은 행렬 A, B가 병렬로 놓이고, 입력 x가 두 경로를 지난 뒤 출력이 더해지는 구조와 파라미터 수 비교</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="460" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#1a2f55">LoRA는 큰 가중치를 얼리고 작은 보정 경로만 학습한다</text><text x="52" y="89" font-size="16" fill="#546a8c">h = W·x + (α/r)·B·A·x   (W는 고정, A와 B만 학습)</text>
<rect x="52" y="210" width="110" height="70" rx="12" fill="#fff" stroke="#3b5f9a" stroke-width="2"/><text x="107" y="252" font-size="18" font-weight="700" fill="#1a2f55" text-anchor="middle">입력 x</text>
<rect x="300" y="130" width="300" height="90" rx="14" fill="#e6eefb" stroke="#3b5f9a" stroke-width="2"/><text x="450" y="166" font-size="18" font-weight="700" fill="#1a2f55" text-anchor="middle">사전학습 가중치 W (고정)</text><text x="450" y="192" font-size="14" fill="#546a8c" text-anchor="middle">d × d, 예: 4096 × 4096 = 16,777,216개</text>
<rect x="300" y="270" width="130" height="80" rx="14" fill="#e3f4e8" stroke="#2f8f4e" stroke-width="2"/><text x="365" y="305" font-size="17" font-weight="700" fill="#1f5c33" text-anchor="middle">A (학습)</text><text x="365" y="330" font-size="13" fill="#1f5c33" text-anchor="middle">r × d, r=8</text>
<rect x="470" y="270" width="130" height="80" rx="14" fill="#e3f4e8" stroke="#2f8f4e" stroke-width="2"/><text x="535" y="305" font-size="17" font-weight="700" fill="#1f5c33" text-anchor="middle">B (학습)</text><text x="535" y="330" font-size="13" fill="#1f5c33" text-anchor="middle">d × r, 초기값 0</text>
<circle cx="700" cy="245" r="28" fill="#fff" stroke="#3b5f9a" stroke-width="2"/><text x="700" y="253" font-size="26" font-weight="700" fill="#1a2f55" text-anchor="middle">+</text>
<rect x="780" y="210" width="110" height="70" rx="12" fill="#fff" stroke="#3b5f9a" stroke-width="2"/><text x="835" y="252" font-size="18" font-weight="700" fill="#1a2f55" text-anchor="middle">출력 h</text>
<path d="M162 245L230 245L230 175L296 175" stroke="#3b5f9a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M230 245L230 310L296 310" stroke="#3b5f9a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M430 310H466" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><path d="M600 175L660 175L690 220" stroke="#3b5f9a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M600 310L660 310L690 268" stroke="#3b5f9a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M728 245H776" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/>
<rect x="52" y="385" width="998" height="52" rx="12" fill="#fff" stroke="#c9d6ec"/><text x="76" y="417" font-size="15" fill="#33496e">학습 대상: A+B = 2×4096×8 = 65,536개 ≈ W의 0.39%. 추론 때는 B·A를 W에 더해 하나로 합칠 수 있다.</text></g></svg>
