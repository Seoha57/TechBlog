<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Oracle JSON Relational Duality View 데이터 경로</title><desc id="desc">관계형 주문 테이블이 duality view를 통해 JSON 문서와 SQL 접근 양쪽으로 연결되는 구조</desc><rect width="1200" height="630" rx="36" fill="#f5faf6"/><text x="70" y="82" fill="#18201c" font-family="Arial, sans-serif" font-size="34" font-weight="700">원본 테이블은 하나, 접근 방식은 관계형과 문서형 두 가지</text><text x="70" y="122" fill="#6e7972" font-family="Arial, sans-serif" font-size="20">Duality View는 JSON을 따로 복사하지 않고 읽을 때 조립하고 허용된 변경을 테이블에 반영한다.</text><rect x="72" y="220" width="260" height="98" rx="18" fill="#fff" stroke="#9ccbad" stroke-width="3"/><text x="104" y="263" fill="#18201c" font-family="Arial, sans-serif" font-size="26" font-weight="700">ORDERS</text><text x="104" y="295" fill="#59695e" font-family="Arial, sans-serif" font-size="17">order_id · status · customer_id</text><rect x="72" y="350" width="260" height="98" rx="18" fill="#fff" stroke="#9ccbad" stroke-width="3"/><text x="104" y="393" fill="#18201c" font-family="Arial, sans-serif" font-size="26" font-weight="700">ORDER_ITEMS</text><text x="104" y="425" fill="#59695e" font-family="Arial, sans-serif" font-size="17">order_id · product_id · quantity</text><path d="M355 270h128M355 400h128" stroke="#6aa88b" stroke-width="5"/><path d="m465 252 20 18-20 18m0 94 20 18-20 18" fill="none" stroke="#6aa88b" stroke-width="5"/><rect x="500" y="228" width="274" height="210" rx="24" fill="#e4f3e7" stroke="#71b68d" stroke-width="3"/><text x="538" y="294" fill="#18201c" font-family="Arial, sans-serif" font-size="29" font-weight="700">DUALITY VIEW</text><text x="538" y="336" fill="#3d7259" font-family="Arial, sans-serif" font-size="19">JSON 계층 매핑</text><text x="538" y="370" fill="#3d7259" font-family="Arial, sans-serif" font-size="19">DML 허용 범위 · ETAG</text><path d="M794 280h112M794 384h112" stroke="#6aa88b" stroke-width="5"/><path d="m888 262 20 18-20 18m-20 68 20 18-20 18" fill="none" stroke="#6aa88b" stroke-width="5"/><rect x="926" y="220" width="200" height="112" rx="18" fill="#fff8e8" stroke="#d6b66b" stroke-width="3"/><text x="960" y="265" fill="#5a481e" font-family="Arial, sans-serif" font-size="24" font-weight="700">JSON 문서</text><text x="960" y="299" fill="#756546" font-family="Arial, sans-serif" font-size="16">API · 앱 객체</text><rect x="926" y="350" width="200" height="112" rx="18" fill="#fff" stroke="#9ccbad" stroke-width="3"/><text x="960" y="395" fill="#18201c" font-family="Arial, sans-serif" font-size="24" font-weight="700">SQL 테이블</text><text x="960" y="429" fill="#59695e" font-family="Arial, sans-serif" font-size="16">분석 · 배치 · DBA</text><text x="72" y="550" fill="#6e7972" font-family="Arial, sans-serif" font-size="18">문서 갱신은 업무 규칙·권한·동시성 정책을 대신하지 않는다. 원본 데이터와 API 계약의 변경 경계를 함께 설계해야 한다.</text></svg>
