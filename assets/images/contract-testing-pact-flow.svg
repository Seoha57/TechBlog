<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Contract Testing with Pact</title>
  <desc id="desc">Consumer contract, Pact Broker, and provider verification flow</desc>
  <rect width="1200" height="520" rx="28" fill="#f3faf6"/>
  <text x="72" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14221d">Contract Testing with Pact</text>
  <text x="72" y="108" font-family="Arial,sans-serif" font-size="17" fill="#648076">소비자가 기대하는 계약을 만들고, 제공자가 이를 검증합니다.</text>
  <line x1="360" y1="285" x2="470" y2="285" stroke="#65ae91" stroke-width="5"/>
  <polygon points="470,285 447,270 447,300" fill="#65ae91"/>
  <line x1="730" y1="285" x2="840" y2="285" stroke="#65ae91" stroke-width="5"/>
  <polygon points="840,285 817,270 817,300" fill="#65ae91"/>
  <rect x="72" y="174" width="288" height="222" rx="22" fill="#fff" stroke="#a9d6c0" stroke-width="3"/>
  <rect x="456" y="174" width="274" height="222" rx="22" fill="#e0f1e8" stroke="#a9d6c0" stroke-width="3"/>
  <rect x="826" y="174" width="302" height="222" rx="22" fill="#fff" stroke="#a9d6c0" stroke-width="3"/>
  <text x="108" y="230" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14221d">Consumer</text>
  <text x="108" y="272" font-family="Arial,sans-serif" font-size="16" fill="#648076">기대하는 요청·응답 예시</text>
  <text x="108" y="304" font-family="Arial,sans-serif" font-size="16" fill="#648076">Pact 파일 생성</text>
  <text x="492" y="230" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14221d">Pact Broker</text>
  <text x="492" y="272" font-family="Arial,sans-serif" font-size="16" fill="#648076">계약과 검증 결과 공유</text>
  <text x="492" y="304" font-family="Arial,sans-serif" font-size="16" fill="#648076">Can I Deploy 판단</text>
  <text x="862" y="230" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14221d">Provider</text>
  <text x="862" y="272" font-family="Arial,sans-serif" font-size="16" fill="#648076">실제 API와 계약 비교</text>
  <text x="862" y="304" font-family="Arial,sans-serif" font-size="16" fill="#648076">Provider verification</text>
</svg>
