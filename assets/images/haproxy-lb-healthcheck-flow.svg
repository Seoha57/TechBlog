<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">HAProxy 로드밸런싱과 헬스체크 흐름</title><desc id="desc">클라이언트 요청이 frontend의 ACL 규칙을 거쳐 backend로 전달되고, 백엔드 서버 풀에서 분산 알고리즘이 서버를 고르며 헬스체크가 장애 서버를 풀에서 제외하는 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="480" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#1a2f55">HAProxy는 요청을 고르고, 헬스체크로 풀을 스스로 정리한다</text><text x="52" y="89" font-size="16" fill="#546a8c">frontend(받는 쪽) → ACL 규칙 → backend(서버 풀) → 분산 알고리즘 → 서버</text>
<rect x="52" y="150" width="150" height="90" rx="14" fill="#fff" stroke="#3b5f9a" stroke-width="2"/><text x="127" y="190" font-size="18" font-weight="700" fill="#1a2f55" text-anchor="middle">클라이언트</text><text x="127" y="214" font-size="14" fill="#546a8c" text-anchor="middle">HTTPS 요청</text>
<rect x="270" y="130" width="200" height="130" rx="14" fill="#e6eefb" stroke="#3b5f9a" stroke-width="2"/><text x="370" y="165" font-size="18" font-weight="700" fill="#1a2f55" text-anchor="middle">frontend</text><text x="370" y="192" font-size="14" fill="#546a8c" text-anchor="middle">bind :443, TLS 종료</text><text x="370" y="214" font-size="14" fill="#546a8c" text-anchor="middle">ACL: 경로·호스트 판별</text><text x="370" y="236" font-size="14" fill="#546a8c" text-anchor="middle">use_backend 선택</text>
<rect x="540" y="110" width="220" height="170" rx="14" fill="#fff" stroke="#3b5f9a" stroke-width="2"/><text x="650" y="145" font-size="18" font-weight="700" fill="#1a2f55" text-anchor="middle">backend: web</text><text x="650" y="172" font-size="14" fill="#546a8c" text-anchor="middle">balance leastconn</text><text x="650" y="194" font-size="14" fill="#546a8c" text-anchor="middle">option httpchk GET /healthz</text><text x="650" y="216" font-size="14" fill="#546a8c" text-anchor="middle">check inter 2s fall 3 rise 2</text><text x="650" y="238" font-size="14" fill="#546a8c" text-anchor="middle">stick-table(선택)</text>
<rect x="840" y="110" width="210" height="60" rx="12" fill="#e3f4e8" stroke="#2f8f4e" stroke-width="2"/><text x="945" y="146" font-size="16" font-weight="700" fill="#1f5c33" text-anchor="middle">web1 UP</text>
<rect x="840" y="190" width="210" height="60" rx="12" fill="#e3f4e8" stroke="#2f8f4e" stroke-width="2"/><text x="945" y="226" font-size="16" font-weight="700" fill="#1f5c33" text-anchor="middle">web2 UP</text>
<rect x="840" y="270" width="210" height="60" rx="12" fill="#fbe6e6" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/><text x="945" y="306" font-size="16" font-weight="700" fill="#8a2a20" text-anchor="middle">web3 DOWN (제외)</text>
<path d="M202 195H266" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><path d="M470 195H536" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><path d="M760 170L836 142" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><path d="M760 195L836 215" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/>
<path d="M700 280C720 320 790 320 836 300" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="6 4"/><text x="690" y="350" font-size="14" fill="#8a2a20">헬스체크 3회 연속 실패 → 풀에서 제외</text><text x="690" y="372" font-size="14" fill="#8a2a20">2회 연속 성공 → 다시 편입</text>
<rect x="52" y="400" width="998" height="52" rx="12" fill="#fff" stroke="#c9d6ec"/><text x="76" y="432" font-size="15" fill="#33496e">핵심: 분산(어디로 보낼까)과 헬스체크(보내도 되는 서버인가)는 별개의 장치이며, 둘이 함께 있어야 무중단에 가까워진다.</text></g></svg>
