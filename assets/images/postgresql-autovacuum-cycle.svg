<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">PostgreSQL MVCC와 autovacuum의 정리 흐름</title><desc id="desc">UPDATE와 DELETE로 이전 행 버전이 남고 autovacuum이 dead tuple을 정리하며 ANALYZE가 통계 정보를 갱신하는 과정</desc><rect width="1200" height="520" fill="#fbfcfa"/><g font-family="Arial, Pretendard, sans-serif"><text x="70" y="72" font-size="30" font-weight="700" fill="#18201c">UPDATE는 행을 덮어쓰지 않고, 이전 버전을 남길 수 있습니다</text><text x="70" y="108" font-size="17" fill="#6e7972">MVCC의 동시성 장점은 주기적인 정리와 통계 갱신을 필요로 합니다.</text><rect x="80" y="180" width="230" height="155" rx="20" fill="#fff" stroke="#c5decf" stroke-width="2"/><text x="114" y="234" font-size="21" font-weight="700" fill="#18201c">INSERT · UPDATE</text><text x="114" y="268" font-size="15" fill="#607168">새 행 버전 생성</text><text x="114" y="294" font-size="15" fill="#607168">이전 버전은 즉시 제거되지 않음</text><path d="M310 257h105m-16-12 16 12-16 12" fill="none" stroke="#65ae91" stroke-width="4"/><rect x="435" y="180" width="240" height="155" rx="20" fill="#fff7ec" stroke="#e5c98e" stroke-width="2"/><text x="468" y="234" font-size="21" font-weight="700" fill="#18201c">dead tuple 누적</text><text x="468" y="268" font-size="15" fill="#765d2e">공간 재사용 지연</text><text x="468" y="294" font-size="15" fill="#765d2e">통계가 오래될 수 있음</text><path d="M675 257h105m-16-12 16 12-16 12" fill="none" stroke="#65ae91" stroke-width="4"/><rect x="800" y="180" width="310" height="155" rx="20" fill="#e2f2e7"/><text x="833" y="234" font-size="21" font-weight="700" fill="#18201c">autovacuum worker</text><text x="833" y="268" font-size="15" fill="#4d6657">VACUUM: 재사용 가능 공간 표시</text><text x="833" y="294" font-size="15" fill="#4d6657">ANALYZE: 플래너 통계 갱신</text><line x1="80" y1="405" x2="1110" y2="405" stroke="#dfe8e1" stroke-width="2"/><text x="80" y="456" font-size="18" font-weight="700" fill="#51705f">정리의 목적은 디스크를 즉시 줄이는 것만이 아니라 성능·트랜잭션 안전성을 유지하는 것이다</text></g></svg>
