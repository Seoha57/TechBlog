<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL과 pgvector를 활용한 벡터 검색</title>
  <desc id="desc">문서 임베딩, PostgreSQL pgvector 저장, 유사도 검색 흐름</desc>
  <rect width="1200" height="520" rx="28" fill="#f3faf6"/>
  <text x="72" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14221d">PostgreSQL + pgvector</text>
  <text x="72" y="108" font-family="Arial,sans-serif" font-size="17" fill="#648076">텍스트를 벡터로 표현하고 가까운 의미를 검색합니다.</text>
  <line x1="350" y1="285" x2="465" y2="285" stroke="#65ae91" stroke-width="5"/><polygon points="465,285 442,270 442,300" fill="#65ae91"/>
  <line x1="735" y1="285" x2="850" y2="285" stroke="#65ae91" stroke-width="5"/><polygon points="850,285 827,270 827,300" fill="#65ae91"/>
  <rect x="72" y="174" width="278" height="222" rx="22" fill="#fff" stroke="#a9d6c0" stroke-width="3"/>
  <rect x="465" y="174" width="270" height="222" rx="22" fill="#e0f1e8" stroke="#a9d6c0" stroke-width="3"/>
  <rect x="850" y="174" width="278" height="222" rx="22" fill="#fff" stroke="#a9d6c0" stroke-width="3"/>
  <text x="108" y="230" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14221d">텍스트·문서</text>
  <text x="108" y="272" font-family="Arial,sans-serif" font-size="16" fill="#648076">임베딩 모델로 변환</text><text x="108" y="304" font-family="Arial,sans-serif" font-size="16" fill="#648076">예: [0.12, -0.44, ...]</text>
  <text x="501" y="230" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14221d">PostgreSQL</text>
  <text x="501" y="272" font-family="Arial,sans-serif" font-size="16" fill="#648076">vector 컬럼에 저장</text><text x="501" y="304" font-family="Arial,sans-serif" font-size="16" fill="#648076">HNSW·IVFFlat 인덱스</text>
  <text x="886" y="230" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#14221d">유사도 검색</text>
  <text x="886" y="272" font-family="Arial,sans-serif" font-size="16" fill="#648076">가까운 벡터를 조회</text><text x="886" y="304" font-family="Arial,sans-serif" font-size="16" fill="#648076">RAG·추천·검색</text>
</svg>
