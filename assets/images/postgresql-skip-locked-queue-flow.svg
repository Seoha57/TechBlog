<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">PostgreSQL SKIP LOCKED 작업 큐 동작</title><desc id="desc">여러 워커가 동시에 큐 테이블에서 작업을 가져올 때 일반 FOR UPDATE는 앞선 워커의 잠금을 기다리지만 SKIP LOCKED는 잠긴 행을 건너뛰고 서로 다른 행을 가져오는 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="480" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="52" font-size="25" font-weight="700" fill="#1a2f55">같은 큐를 읽는 워커 세 개: 기다릴 것인가, 건너뛸 것인가</text>
<rect x="52" y="86" width="480" height="360" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="292" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2f55">FOR UPDATE만 사용</text>
<rect x="80" y="146" width="130" height="150" rx="10" fill="#fbe9e7" stroke="#d98b80"/><text x="145" y="172" text-anchor="middle" font-size="13" fill="#1a2f55">job 1 (잠김)</text><text x="145" y="198" text-anchor="middle" font-size="13" fill="#1a2f55">job 2</text><text x="145" y="224" text-anchor="middle" font-size="13" fill="#1a2f55">job 3</text><text x="145" y="250" text-anchor="middle" font-size="13" fill="#1a2f55">job 4</text><text x="145" y="276" text-anchor="middle" font-size="13" fill="#1a2f55">job 5</text>
<text x="360" y="176" font-size="14" fill="#1a2f55">워커 A: job 1 처리 중</text><text x="360" y="212" font-size="14" fill="#9b3b30">워커 B: job 1 잠금 대기</text><text x="360" y="248" font-size="14" fill="#9b3b30">워커 C: job 1 잠금 대기</text>
<path d="M215 215 L350 205" stroke="#3b5f9a" stroke-width="2" marker-end="url(#a)" fill="none"/>
<text x="292" y="332" text-anchor="middle" font-size="14" fill="#1a2f55">처리량이 사실상 워커 1개로 줄어든다</text><text x="292" y="360" text-anchor="middle" font-size="13" fill="#546a8c">A가 커밋하면 B가 같은 행을 다시 평가한다</text><text x="292" y="386" text-anchor="middle" font-size="13" fill="#546a8c">행이 이미 처리됨(done)이면 B는 0행을 받는다</text><text x="292" y="420" text-anchor="middle" font-size="13" fill="#546a8c">장점: 순서 보장이 가장 엄격함</text>
<rect x="568" y="86" width="480" height="360" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="808" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2f55">FOR UPDATE SKIP LOCKED</text>
<rect x="596" y="146" width="130" height="150" rx="10" fill="#e3f0e0" stroke="#78a870"/><text x="661" y="172" text-anchor="middle" font-size="13" fill="#1a2f55">job 1 (A가 잠금)</text><text x="661" y="198" text-anchor="middle" font-size="13" fill="#1a2f55">job 2 (B가 잠금)</text><text x="661" y="224" text-anchor="middle" font-size="13" fill="#1a2f55">job 3 (C가 잠금)</text><text x="661" y="250" text-anchor="middle" font-size="13" fill="#1a2f55">job 4 (대기)</text><text x="661" y="276" text-anchor="middle" font-size="13" fill="#1a2f55">job 5 (대기)</text>
<text x="876" y="176" font-size="14" fill="#1a2f55">워커 A: job 1</text><text x="876" y="212" font-size="14" fill="#1a2f55">워커 B: job 2 (job 1 건너뜀)</text><text x="876" y="248" font-size="14" fill="#1a2f55">워커 C: job 3 (1·2 건너뜀)</text>
<path d="M731 215 L866 205" stroke="#3b5f9a" stroke-width="2" marker-end="url(#a)" fill="none"/>
<text x="808" y="332" text-anchor="middle" font-size="14" fill="#1a2f55">워커 수만큼 병렬로 처리된다</text><text x="808" y="360" text-anchor="middle" font-size="13" fill="#546a8c">잠긴 행은 결과에서 조용히 빠진다</text><text x="808" y="386" text-anchor="middle" font-size="13" fill="#546a8c">대신 처리 순서는 엄격한 FIFO가 아니다</text><text x="808" y="420" text-anchor="middle" font-size="13" fill="#546a8c">큐 용도 외의 일반 조회에는 부적합</text></g></svg>
