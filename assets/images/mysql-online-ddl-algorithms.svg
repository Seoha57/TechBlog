<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">MySQL Online DDL 알고리즘 비교</title><desc id="desc">INSTANT는 메타데이터만 변경하고, INPLACE는 온라인 로그를 쌓은 뒤 반영하며, COPY는 새 테이블로 복사한 뒤 교체한다. 모두 시작과 끝에 짧은 배타 메타데이터 락 구간이 있다.</desc><rect width="1100" height="460" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="52" font-size="25" font-weight="700" fill="#1a2f55">세 알고리즘은 작업량이 다르지만 시작과 끝의 메타데이터 락은 같다</text><text x="52" y="82" font-size="14" fill="#546a8c">주황 구간 = 배타 메타데이터 락(MDL) 요청, 오래 열린 트랜잭션이 있으면 여기서 대기가 생긴다</text><text x="52" y="140" font-size="17" font-weight="700" fill="#1a2f55">INSTANT</text><rect x="200" y="115" width="60" height="40" rx="8" fill="#f6c58b" stroke="#c98a3b"/><rect x="262" y="115" width="200" height="40" rx="8" fill="#dce6f7" stroke="#6f8cc0"/><text x="362" y="140" text-anchor="middle" font-size="13" fill="#1a2f55">데이터 사전만 변경</text><rect x="464" y="115" width="60" height="40" rx="8" fill="#f6c58b" stroke="#c98a3b"/><text x="560" y="140" font-size="13" fill="#546a8c">행 재작성 없음, 크기와 무관</text><text x="52" y="240" font-size="17" font-weight="700" fill="#1a2f55">INPLACE</text><rect x="200" y="215" width="60" height="40" rx="8" fill="#f6c58b" stroke="#c98a3b"/><rect x="262" y="215" width="330" height="40" rx="8" fill="#dce6f7" stroke="#6f8cc0"/><text x="427" y="240" text-anchor="middle" font-size="13" fill="#1a2f55">인덱스 생성 등 작업 + 온라인 로그 기록</text><rect x="594" y="215" width="60" height="40" rx="8" fill="#f6c58b" stroke="#c98a3b"/><text x="680" y="240" font-size="13" fill="#546a8c">DML 허용, 로그를 마지막에 반영</text><text x="52" y="340" font-size="17" font-weight="700" fill="#1a2f55">COPY</text><rect x="200" y="315" width="60" height="40" rx="8" fill="#f6c58b" stroke="#c98a3b"/><rect x="262" y="315" width="400" height="40" rx="8" fill="#fbe9e7" stroke="#d98b80"/><text x="462" y="340" text-anchor="middle" font-size="13" fill="#1a2f55">새 테이블로 전체 행 복사(쓰기 대기)</text><rect x="664" y="315" width="60" height="40" rx="8" fill="#f6c58b" stroke="#c98a3b"/><text x="740" y="340" font-size="13" fill="#546a8c">이름 교체, 가장 큰 작업량</text><line x1="200" y1="400" x2="900" y2="400" stroke="#8fa8d4" stroke-width="2"/><text x="200" y="428" font-size="13" fill="#546a8c">시간 →  (막대 길이는 작업량의 개념적 비교이며 실측값이 아님)</text></g></svg>
