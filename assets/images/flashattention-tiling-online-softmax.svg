<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">표준 어텐션과 FlashAttention의 메모리 이동 비교</title><desc id="desc">표준 어텐션은 N×N 점수 행렬을 HBM에 쓰고 다시 읽지만, FlashAttention은 K와 V를 타일로 나누어 SRAM에서 온라인 softmax로 누적하고 최종 출력만 HBM에 쓴다</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="480" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#1a2f55">계산은 같고, 메모리 이동만 줄인다</text><text x="52" y="89" font-size="16" fill="#546a8c">N×N 점수 행렬을 HBM에 만들지 않고 타일 단위로 SRAM에서 끝낸다</text><rect x="52" y="120" width="480" height="320" rx="20" fill="#fff" stroke="#c9a0a0" stroke-width="2"/><text x="292" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#7a2020">표준 어텐션</text><rect x="80" y="180" width="140" height="56" rx="10" fill="#fdecec" stroke="#c46a6a"/><text x="150" y="213" text-anchor="middle" font-size="15" fill="#7a2020">S = QKᵀ (N×N)</text><rect x="80" y="270" width="140" height="56" rx="10" fill="#fdecec" stroke="#c46a6a"/><text x="150" y="303" text-anchor="middle" font-size="15" fill="#7a2020">P = softmax(S)</text><rect x="80" y="360" width="140" height="56" rx="10" fill="#fdecec" stroke="#c46a6a"/><text x="150" y="393" text-anchor="middle" font-size="15" fill="#7a2020">O = PV</text><rect x="340" y="180" width="160" height="236" rx="14" fill="#f5e3e3" stroke="#c46a6a" stroke-width="2"/><text x="420" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#7a2020">HBM</text><text x="420" y="260" text-anchor="middle" font-size="14" fill="#7a2020">S 쓰기·읽기</text><text x="420" y="290" text-anchor="middle" font-size="14" fill="#7a2020">P 쓰기·읽기</text><text x="420" y="340" text-anchor="middle" font-size="14" fill="#7a2020">N² 크기 저장</text><path d="M220 208H336" stroke="#c46a6a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M336 240H224" stroke="#c46a6a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M220 298H336" stroke="#c46a6a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M336 330H224" stroke="#c46a6a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="568" y="120" width="480" height="320" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="808" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2f55">FlashAttention</text><rect x="596" y="180" width="200" height="236" rx="14" fill="#e6f4ea" stroke="#5b9a6e" stroke-width="2"/><text x="696" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4d2e">SRAM (온칩)</text><text x="696" y="248" text-anchor="middle" font-size="14" fill="#1d4d2e">Q 블록 + K·V 타일 j</text><text x="696" y="276" text-anchor="middle" font-size="14" fill="#1d4d2e">작은 점수 조각 계산</text><text x="696" y="304" text-anchor="middle" font-size="14" fill="#1d4d2e">m, ℓ, O 갱신 (온라인 softmax)</text><text x="696" y="332" text-anchor="middle" font-size="14" fill="#1d4d2e">조각은 버리고 다음 타일</text><text x="696" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4d2e">N×N 행렬 없음</text><rect x="876" y="180" width="150" height="236" rx="14" fill="#dce6f7" stroke="#6f8cc0" stroke-width="2"/><text x="951" y="210" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2f55">HBM</text><text x="951" y="256" text-anchor="middle" font-size="14" fill="#1a2f55">Q, K, V 읽기</text><text x="951" y="296" text-anchor="middle" font-size="14" fill="#1a2f55">최종 O 쓰기</text><text x="951" y="336" text-anchor="middle" font-size="14" fill="#546a8c">통계 m·ℓ만 저장</text><path d="M872 240H800" stroke="#3b5f9a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M800 330H872" stroke="#3b5f9a" stroke-width="2.5" fill="none" marker-end="url(#a)"/></g></svg>
