<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL 논리 복제와 CDC 흐름</title>
  <desc id="desc">Publisher의 트랜잭션이 WAL과 논리 디코딩을 거쳐 publication과 replication slot으로 전달되고 Subscriber 및 CDC 소비자가 LSN 위치를 확인하는 흐름</desc>
  <rect width="1200" height="560" rx="36" fill="#f3faf5"/>
  <text x="72" y="82" fill="#17261f" font-family="Arial, sans-serif" font-size="30" font-weight="700">변경은 WAL에 남고, 소비 위치는 LSN으로 이어진다</text>
  <text x="72" y="116" fill="#537064" font-family="Arial, sans-serif" font-size="18">논리 복제는 데이터 파일 전체가 아니라 발행 대상으로 고른 행 변경을 전달한다.</text>
  <path d="M122 268 H430 M510 268 H770 M850 268 H1058" stroke="#6eb296" stroke-width="7" stroke-linecap="round"/>
  <path d="M402 246 l28 22 -28 22 M742 246 l28 22 -28 22 M1030 246 l28 22 -28 22" fill="none" stroke="#6eb296" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="268" r="46" fill="#dff1e5" stroke="#5fa685" stroke-width="3"/>
  <path d="M91 276 h38 M98 258 h24 M98 294 h24" stroke="#1b4934" stroke-width="5" stroke-linecap="round"/>
  <text x="68" y="352" fill="#17261f" font-family="Arial, sans-serif" font-size="21" font-weight="700">트랜잭션</text>
  <text x="54" y="380" fill="#537064" font-family="Arial, sans-serif" font-size="16">INSERT · UPDATE · DELETE</text>
  <rect x="430" y="188" width="170" height="160" rx="18" fill="#fff" stroke="#8fc5a8" stroke-width="3"/>
  <text x="463" y="240" fill="#17261f" font-family="Arial, sans-serif" font-size="23" font-weight="700">WAL</text>
  <text x="457" y="271" fill="#537064" font-family="Arial, sans-serif" font-size="16">논리 디코딩</text>
  <text x="452" y="300" fill="#537064" font-family="Arial, sans-serif" font-size="16">pgoutput</text>
  <rect x="770" y="176" width="170" height="184" rx="18" fill="#e7f5eb" stroke="#6eb296" stroke-width="3"/>
  <text x="796" y="229" fill="#17261f" font-family="Arial, sans-serif" font-size="22" font-weight="700">Publication</text>
  <text x="799" y="260" fill="#537064" font-family="Arial, sans-serif" font-size="16">선택한 테이블</text>
  <text x="789" y="314" fill="#1b4934" font-family="Arial, sans-serif" font-size="18" font-weight="700">Replication slot</text>
  <rect x="1058" y="176" width="92" height="184" rx="18" fill="#fff" stroke="#8fc5a8" stroke-width="3"/>
  <text x="1072" y="230" fill="#17261f" font-family="Arial, sans-serif" font-size="19" font-weight="700">Subscriber</text>
  <text x="1084" y="261" fill="#537064" font-family="Arial, sans-serif" font-size="16">apply</text>
  <text x="1077" y="316" fill="#1b4934" font-family="Arial, sans-serif" font-size="17" font-weight="700">LSN</text>
  <path d="M854 418 C854 468 980 468 1052 418" fill="none" stroke="#8aab9c" stroke-width="3" stroke-dasharray="8 10"/>
  <text x="826" y="500" fill="#537064" font-family="Arial, sans-serif" font-size="17">소비자가 확인한 위치까지 WAL을 정리할 수 있다</text>
</svg>
