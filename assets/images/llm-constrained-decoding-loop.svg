<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">LLM 구조화 출력의 제약 디코딩 흐름</title><desc id="desc">LLM이 다음 토큰 점수를 계산하고 grammar가 허용 토큰을 걸러 JSON Schema에 맞는 결과를 만든 뒤 서버 검증으로 이어지는 구조</desc><rect width="1200" height="650" rx="36" fill="#f5faf6"/><text x="70" y="84" fill="#18201c" font-family="Arial, sans-serif" font-size="34" font-weight="700">문법은 출력의 모양을 제한하고, 서버는 내용과 권한을 검증한다</text><text x="70" y="125" fill="#6e7972" font-family="Arial, sans-serif" font-size="20">Constrained decoding은 생성 단계에서 문법상 불가능한 토큰을 후보에서 제외한다.</text><rect x="72" y="225" width="220" height="140" rx="20" fill="#fff" stroke="#9ccbad" stroke-width="3"/><text x="106" y="278" fill="#18201c" font-family="Arial, sans-serif" font-size="26" font-weight="700">LLM logits</text><text x="106" y="315" fill="#59695e" font-family="Arial, sans-serif" font-size="18">다음 토큰 후보·점수</text><path d="M314 294h110" stroke="#6aa88b" stroke-width="5"/><path d="m406 276 20 18-20 18" fill="none" stroke="#6aa88b" stroke-width="5"/><rect x="445" y="202" width="300" height="186" rx="24" fill="#e3f2e6" stroke="#71b68d" stroke-width="3"/><text x="486" y="258" fill="#18201c" font-family="Arial, sans-serif" font-size="28" font-weight="700">Grammar / Schema</text><text x="486" y="300" fill="#3d7259" font-family="Arial, sans-serif" font-size="18">현재 parser 상태</text><text x="486" y="333" fill="#3d7259" font-family="Arial, sans-serif" font-size="18">허용 token mask</text><path d="M765 294h105" stroke="#6aa88b" stroke-width="5"/><path d="m852 276 20 18-20 18" fill="none" stroke="#6aa88b" stroke-width="5"/><rect x="892" y="225" width="235" height="140" rx="20" fill="#fff8e8" stroke="#d6b66b" stroke-width="3"/><text x="928" y="278" fill="#5a481e" font-family="Arial, sans-serif" font-size="25" font-weight="700">유효 JSON</text><text x="928" y="315" fill="#756546" font-family="Arial, sans-serif" font-size="17">Schema 형태 준수</text><path d="M1010 388v74" stroke="#6aa88b" stroke-width="5"/><path d="m992 444 18 20 18-20" fill="none" stroke="#6aa88b" stroke-width="5"/><rect x="834" y="484" width="293" height="100" rx="18" fill="#fff3f1" stroke="#e3a097" stroke-width="3"/><text x="868" y="527" fill="#8a3028" font-family="Arial, sans-serif" font-size="24" font-weight="700">서버 검증</text><text x="868" y="560" fill="#79564f" font-family="Arial, sans-serif" font-size="16">권한 · 사실성 · 업무 규칙</text><path d="M594 390v102H362" stroke="#6aa88b" stroke-width="4" stroke-dasharray="9 8" fill="none"/><path d="m380 474-20 18 20 18" fill="none" stroke="#6aa88b" stroke-width="4"/><text x="150" y="510" fill="#3d7259" font-family="Arial, sans-serif" font-size="18">선택한 토큰을 commit하고</text><text x="150" y="538" fill="#3d7259" font-family="Arial, sans-serif" font-size="18">다음 위치의 mask를 다시 계산</text><text x="70" y="620" fill="#6e7972" font-family="Arial, sans-serif" font-size="17">형식 제약은 환각·프롬프트 인젝션·권한 오류를 해결하지 않는다. 별도 검증과 승인 경계가 필요하다.</text></svg>
