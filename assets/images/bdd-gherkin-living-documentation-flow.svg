<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">BDD 협업과 실행 가능한 명세 흐름</title><desc id="desc">기획자, 개발자, 테스터가 구체적 예제를 함께 논의하고, 이를 Gherkin 시나리오로 정리한 뒤 스텝 정의가 제품 코드를 호출해 자동 검증하며, 결과가 살아 있는 문서로 돌아오는 흐름.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="440" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="52" font-size="25" font-weight="700" fill="#1a2f55">대화에서 나온 예제가 명세이자 테스트가 된다</text><rect x="52" y="90" width="200" height="110" rx="14" fill="#dce6f7" stroke="#6f8cc0"/><text x="152" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">① 3자 대화</text><text x="152" y="146" text-anchor="middle" font-size="13" fill="#1a2f55">기획·개발·테스트가</text><text x="152" y="166" text-anchor="middle" font-size="13" fill="#1a2f55">구체적 예제로 합의</text><line x1="252" y1="145" x2="302" y2="145" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="304" y="90" width="220" height="110" rx="14" fill="#dce6f7" stroke="#6f8cc0"/><text x="414" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">② Gherkin 시나리오</text><text x="414" y="146" text-anchor="middle" font-size="13" fill="#1a2f55">Given 상황 / When 행동</text><text x="414" y="166" text-anchor="middle" font-size="13" fill="#1a2f55">Then 기대 결과 (.feature)</text><line x1="524" y1="145" x2="574" y2="145" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="576" y="90" width="220" height="110" rx="14" fill="#dce6f7" stroke="#6f8cc0"/><text x="686" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">③ 스텝 정의</text><text x="686" y="146" text-anchor="middle" font-size="13" fill="#1a2f55">문장 → 코드 연결</text><text x="686" y="166" text-anchor="middle" font-size="13" fill="#1a2f55">(자동화 계층)</text><line x1="796" y1="145" x2="846" y2="145" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="848" y="90" width="200" height="110" rx="14" fill="#e3f0e0" stroke="#78a870"/><text x="948" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">④ 제품 코드 호출</text><text x="948" y="146" text-anchor="middle" font-size="13" fill="#1a2f55">서비스 계층 또는 API</text><text x="948" y="166" text-anchor="middle" font-size="13" fill="#1a2f55">를 직접 실행·검증</text><line x1="948" y1="200" x2="948" y2="262" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="700" y="264" width="348" height="80" rx="14" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="874" y="294" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">⑤ 실행 결과 보고서</text><text x="874" y="320" text-anchor="middle" font-size="13" fill="#1a2f55">통과·실패가 업무 언어로 표시됨</text><line x1="700" y1="304" x2="250" y2="304" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="52" y="264" width="196" height="80" rx="14" fill="#fff8e6" stroke="#d9b45f"/><text x="150" y="294" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">살아 있는 문서</text><text x="150" y="320" text-anchor="middle" font-size="13" fill="#1a2f55">코드와 어긋나면 즉시 드러남</text><rect x="52" y="372" width="996" height="44" rx="12" fill="#fffdf5" stroke="#d9b45f"/><text x="550" y="400" text-anchor="middle" font-size="14" fill="#1a2f55">핵심은 도구가 아니라 ①의 대화다 — 시나리오만 쓰고 대화를 건너뛰면 BDD가 아니라 장황한 테스트 스크립트가 된다</text></g></svg>
