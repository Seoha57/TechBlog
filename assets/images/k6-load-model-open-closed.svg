<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">k6 부하 모델 비교</title><desc id="desc">VU 수를 고정하는 닫힌 모델과 초당 도착률을 고정하는 열린 모델이 서버 지연 증가에 다르게 반응하는 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="480" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#1a2f55">부하 테스트는 몇 명이 아니라 어떤 도착 패턴인지를 먼저 정한다</text><text x="52" y="89" font-size="16" fill="#546a8c">서버가 느려졌을 때 부하 생성기가 어떻게 반응하는지가 두 모델의 차이다</text><rect x="52" y="130" width="480" height="260" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="292" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2f55">닫힌 모델 (VU 기반)</text><text x="292" y="190" text-anchor="middle" font-size="13" fill="#546a8c">executor: constant-vus, ramping-vus</text><rect x="80" y="215" width="120" height="50" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="140" y="245" text-anchor="middle" font-size="14" fill="#1a2f55">VU 50개</text><line x1="200" y1="240" x2="248" y2="240" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="250" y="215" width="120" height="50" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="310" y="245" text-anchor="middle" font-size="14" fill="#1a2f55">응답 대기</text><line x1="370" y1="240" x2="418" y2="240" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="420" y="215" width="92" height="50" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="466" y="245" text-anchor="middle" font-size="14" fill="#1a2f55">다음 반복</text><text x="292" y="305" text-anchor="middle" font-size="14" fill="#1a2f55">응답이 느리면 요청 속도가 자동으로 줄어든다</text><text x="292" y="332" text-anchor="middle" font-size="13" fill="#546a8c">포화 상황이 가려질 수 있음 (coordinated omission 유사)</text><text x="292" y="358" text-anchor="middle" font-size="13" fill="#546a8c">적합: 동시 사용자 수가 고정된 내부 시스템</text><rect x="568" y="130" width="480" height="260" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="808" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#1a2f55">열린 모델 (도착률 기반)</text><text x="808" y="190" text-anchor="middle" font-size="13" fill="#546a8c">executor: constant-arrival-rate, ramping-arrival-rate</text><rect x="596" y="215" width="120" height="50" rx="10" fill="#e3f0e0" stroke="#78a870"/><text x="656" y="245" text-anchor="middle" font-size="14" fill="#1a2f55">초당 100건 도착</text><line x1="716" y1="240" x2="764" y2="240" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="766" y="215" width="120" height="50" rx="10" fill="#e3f0e0" stroke="#78a870"/><text x="826" y="245" text-anchor="middle" font-size="14" fill="#1a2f55">VU 풀에서 할당</text><line x1="886" y1="240" x2="934" y2="240" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="936" y="215" width="92" height="50" rx="10" fill="#e3f0e0" stroke="#78a870"/><text x="982" y="245" text-anchor="middle" font-size="14">요청</text><text x="808" y="305" text-anchor="middle" font-size="14" fill="#1a2f55">서버가 느려도 도착 속도는 유지된다</text><text x="808" y="332" text-anchor="middle" font-size="13" fill="#546a8c">VU가 부족하면 dropped_iterations 증가</text><text x="808" y="358" text-anchor="middle" font-size="13" fill="#546a8c">적합: 공개 API처럼 외부 도착이 독립적인 서비스</text></g></svg>
