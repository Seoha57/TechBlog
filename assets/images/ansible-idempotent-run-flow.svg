<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Ansible 멱등 실행 흐름</title><desc id="desc">인벤토리와 플레이북을 읽은 제어 노드가 SSH로 대상 서버의 현재 상태를 확인하고, 이미 원하는 상태면 ok, 다르면 changed로 바꾸며 핸들러를 한 번만 실행하는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="460" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#1a2f55">Ansible은 명령을 실행하지 않고 원하는 상태를 맞춘다</text><text x="52" y="89" font-size="16" fill="#546a8c">같은 플레이북을 두 번 돌려도 두 번째는 ok만 나오는 것이 멱등성의 목표다</text><rect x="52" y="130" width="230" height="250" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="167" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2f55">제어 노드</text><rect x="72" y="185" width="190" height="42" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="167" y="212" text-anchor="middle" font-size="14" fill="#1a2f55">inventory.ini</text><rect x="72" y="240" width="190" height="42" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="167" y="267" text-anchor="middle" font-size="14" fill="#1a2f55">site.yml (플레이북)</text><rect x="72" y="295" width="190" height="42" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="167" y="322" text-anchor="middle" font-size="14" fill="#1a2f55">group_vars / vault</text><line x1="282" y1="255" x2="398" y2="255" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><text x="340" y="242" text-anchor="middle" font-size="13" fill="#546a8c">SSH</text><rect x="400" y="130" width="300" height="250" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="550" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2f55">대상 서버 (관리 노드)</text><rect x="420" y="185" width="260" height="42" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="550" y="212" text-anchor="middle" font-size="14" fill="#1a2f55">1. 현재 상태 조사 (패키지·파일·서비스)</text><rect x="420" y="240" width="260" height="42" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="550" y="267" text-anchor="middle" font-size="14" fill="#1a2f55">2. 원하는 상태와 비교</text><rect x="420" y="295" width="260" height="42" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="550" y="322" text-anchor="middle" font-size="14" fill="#1a2f55">3. 다를 때만 수정</text><line x1="700" y1="255" x2="778" y2="255" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="780" y="130" width="268" height="250" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="914" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2f55">결과 상태</text><rect x="800" y="185" width="228" height="42" rx="10" fill="#e3f0e0" stroke="#78a870"/><text x="914" y="212" text-anchor="middle" font-size="14" fill="#1a2f55">ok: 이미 일치, 변경 없음</text><rect x="800" y="240" width="228" height="42" rx="10" fill="#fdf0d8" stroke="#c9a24f"/><text x="914" y="267" text-anchor="middle" font-size="14" fill="#1a2f55">changed: 수정함</text><rect x="800" y="295" width="228" height="42" rx="10" fill="#fbe3e0" stroke="#c97a70"/><text x="914" y="322" text-anchor="middle" font-size="14" fill="#1a2f55">changed 시 핸들러 1회 실행</text><text x="550" y="420" text-anchor="middle" font-size="14" fill="#546a8c">--check는 3단계를 건너뛰고 "무엇이 바뀔지"만 보고한다</text></g></svg>
