<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">vLLM API 요청 스케줄링 구조</title><desc id="desc">길이가 다른 여러 API 요청이 vLLM 스케줄러를 통해 GPU의 모델 가중치와 KV Cache를 공유하고 스트리밍 응답으로 나가는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3a8274"/></marker></defs><rect width="1100" height="500" rx="28" fill="#f6fbf9"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#173d36">LLM 서빙은 모델 실행보다 요청과 메모리 관리의 문제이기도 하다</text><text x="52" y="89" font-size="16" fill="#59766f">길이가 다른 요청을 생성 iteration마다 조정하고 KV Cache block을 관리한다</text><rect x="55" y="145" width="200" height="230" rx="20" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="155" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#204f46">API 요청</text><text x="155" y="222" text-anchor="middle" font-size="14" fill="#4d6e67">짧은 채팅</text><text x="155" y="250" text-anchor="middle" font-size="14" fill="#4d6e67">긴 문서 요약</text><text x="155" y="278" text-anchor="middle" font-size="14" fill="#4d6e67">stream · cancel</text><text x="155" y="326" text-anchor="middle" font-size="13" fill="#59766f">인증·quota·rate limit은</text><text x="155" y="347" text-anchor="middle" font-size="13" fill="#59766f">별도 API 경계에서 설계</text><rect x="355" y="145" width="225" height="230" rx="20" fill="#dff1eb" stroke="#6ab29f" stroke-width="2"/><text x="467" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#204f46">vLLM Scheduler</text><text x="467" y="222" text-anchor="middle" font-size="14" fill="#3f6f65">continuous batching</text><text x="467" y="250" text-anchor="middle" font-size="14" fill="#3f6f65">요청별 token 생성 조정</text><text x="467" y="278" text-anchor="middle" font-size="14" fill="#3f6f65">대기열·max token 제한</text><text x="467" y="326" text-anchor="middle" font-size="13" fill="#59766f">처리량과 첫 토큰 지연의</text><text x="467" y="347" text-anchor="middle" font-size="13" fill="#59766f">균형을 workload로 검증</text><rect x="680" y="120" width="340" height="280" rx="22" fill="#fff" stroke="#7fbcaf" stroke-width="2"/><text x="710" y="163" font-size="18" font-weight="700" fill="#204f46">GPU VRAM</text><rect x="710" y="190" width="280" height="62" rx="12" fill="#dcefe9"/><text x="850" y="229" text-anchor="middle" font-size="16" font-weight="700" fill="#285c52">모델 가중치 · 읽기 전용</text><rect x="710" y="274" width="120" height="87" rx="12" fill="#fff8ec" stroke="#e7b26a"/><text x="770" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#825922">KV Cache</text><text x="770" y="336" text-anchor="middle" font-size="12" fill="#775d3b">요청 A block</text><rect x="850" y="274" width="140" height="87" rx="12" fill="#f3e6ee" stroke="#c490ab"/><text x="920" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#713b56">KV Cache</text><text x="920" y="336" text-anchor="middle" font-size="12" fill="#714e5e">요청 B block</text><path d="M255 260H346M580 260H670" fill="none" stroke="#3a8274" stroke-width="3" marker-end="url(#a)"/><text x="550" y="453" text-anchor="middle" font-size="16" font-weight="700" fill="#285c52">API 모양의 호환성은 모델 품질·보안·부가 기능의 동등성을 뜻하지 않는다</text></g></svg>
