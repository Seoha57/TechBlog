<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">GraphRAG 색인과 질의 흐름</title><desc id="desc">문서를 청크로 나눠 엔티티와 관계를 추출하고 그래프와 커뮤니티 요약을 만든 뒤, 질문 유형에 따라 로컬 검색과 글로벌 검색으로 나뉘어 답을 만드는 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="480" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#1a2f55">GraphRAG는 색인 단계에서 관계를 미리 만들어 둔다</text><text x="52" y="89" font-size="16" fill="#546a8c">조각 검색이 놓치는 "여러 문서에 걸친 연결"과 "전체 주제"를 그래프로 다룬다</text><rect x="52" y="125" width="480" height="150" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="292" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2f55">색인 단계 (비용이 큰 오프라인 작업)</text><rect x="70" y="175" width="100" height="70" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="120" y="205" text-anchor="middle" font-size="13" fill="#1a2f55">문서</text><text x="120" y="224" text-anchor="middle" font-size="13" fill="#1a2f55">청크 분할</text><line x1="170" y1="210" x2="190" y2="210" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="192" y="175" width="100" height="70" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="242" y="205" text-anchor="middle" font-size="13" fill="#1a2f55">LLM이 엔티티</text><text x="242" y="224" text-anchor="middle" font-size="13" fill="#1a2f55">·관계 추출</text><line x1="292" y1="210" x2="312" y2="210" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="314" y="175" width="100" height="70" rx="10" fill="#dce6f7" stroke="#6f8cc0"/><text x="364" y="205" text-anchor="middle" font-size="13" fill="#1a2f55">그래프 구성</text><text x="364" y="224" text-anchor="middle" font-size="13" fill="#1a2f55">커뮤니티 탐지</text><line x1="414" y1="210" x2="434" y2="210" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="436" y="175" width="84" height="70" rx="10" fill="#e3f0e0" stroke="#78a870"/><text x="478" y="205" text-anchor="middle" font-size="13" fill="#1a2f55">커뮤니티</text><text x="478" y="224" text-anchor="middle" font-size="13" fill="#1a2f55">요약 생성</text><rect x="568" y="125" width="480" height="150" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="808" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2f55">저장소</text><rect x="590" y="175" width="130" height="70" rx="10" fill="#e3f0e0" stroke="#78a870"/><text x="655" y="205" text-anchor="middle" font-size="13" fill="#1a2f55">엔티티·관계</text><text x="655" y="224" text-anchor="middle" font-size="13" fill="#1a2f55">테이블/그래프</text><rect x="738" y="175" width="130" height="70" rx="10" fill="#e3f0e0" stroke="#78a870"/><text x="803" y="205" text-anchor="middle" font-size="13" fill="#1a2f55">커뮤니티 요약</text><text x="803" y="224" text-anchor="middle" font-size="13" fill="#1a2f55">보고서</text><rect x="886" y="175" width="144" height="70" rx="10" fill="#e3f0e0" stroke="#78a870"/><text x="958" y="205" text-anchor="middle" font-size="13" fill="#1a2f55">원문 청크</text><text x="958" y="224" text-anchor="middle" font-size="13" fill="#1a2f55">벡터 인덱스</text><line x1="532" y1="200" x2="566" y2="200" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/><rect x="52" y="320" width="480" height="120" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="292" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2f55">로컬 검색: "A 부품 공급사의 다른 납품 건은?"</text><text x="292" y="378" text-anchor="middle" font-size="14" fill="#1a2f55">엔티티에서 시작해 이웃 관계와 원문 청크를 모은다</text><text x="292" y="404" text-anchor="middle" font-size="13" fill="#546a8c">특정 대상 중심, 비용 낮음</text><rect x="568" y="320" width="480" height="120" rx="20" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="808" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#1a2f55">글로벌 검색: "이 문서 전체의 주요 위험 주제는?"</text><text x="808" y="378" text-anchor="middle" font-size="14" fill="#1a2f55">커뮤니티 요약을 부분 답변으로 만든 뒤 합친다</text><text x="808" y="404" text-anchor="middle" font-size="13" fill="#546a8c">전체 요약형 질문, 비용 높음</text><line x1="700" y1="275" x2="700" y2="318" stroke="#3b5f9a" stroke-width="3" marker-end="url(#a)"/></g></svg>
