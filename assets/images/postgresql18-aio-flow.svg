<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">PostgreSQL 18 비동기 I/O 요청 타임라인</title><desc id="desc">동기 I/O와 비동기 I/O에서 읽기 요청이 처리되는 시간 차이</desc><rect width="1200" height="560" fill="#fbfcfa"/><g font-family="Arial, Pretendard, sans-serif" fill="#18201c"><text x="70" y="70" font-size="30" font-weight="700">읽기 요청을 어떻게 겹쳐 처리할까</text><text x="70" y="105" font-size="17" fill="#6e7972">PostgreSQL 18 AIO의 핵심은 요청을 여러 개 준비해 대기 시간을 줄이는 데 있습니다.</text><text x="70" y="180" font-size="18" font-weight="700">기존: 요청 하나가 끝날 때까지 다음 읽기를 기다림</text><g fill="#6e7972" font-size="13"><text x="300" y="140">0ms</text><text x="540" y="140">100ms</text><text x="780" y="140">200ms</text><text x="1020" y="140">300ms</text></g><text x="72" y="230" font-size="16" fill="#6e7972">backend</text><rect x="300" y="198" width="220" height="48" rx="8" fill="#e8ece9"/><text x="320" y="229" font-size="15">read page A · wait</text><rect x="550" y="198" width="220" height="48" rx="8" fill="#e8ece9"/><text x="570" y="229" font-size="15">read page B · wait</text><rect x="800" y="198" width="220" height="48" rx="8" fill="#e8ece9"/><text x="820" y="229" font-size="15">read page C · wait</text><line x1="70" y1="290" x2="1130" y2="290" stroke="#dfe8e1"/><text x="70" y="345" font-size="18" font-weight="700">AIO: 여러 읽기 요청을 큐에 넣고 완료 결과를 받음</text><text x="72" y="395" font-size="16" fill="#6e7972">backend</text><rect x="300" y="365" width="110" height="48" rx="8" fill="#dff1e6"/><text x="317" y="396" font-size="15">queue A</text><rect x="425" y="365" width="110" height="48" rx="8" fill="#dff1e6"/><text x="442" y="396" font-size="15">queue B</text><rect x="550" y="365" width="110" height="48" rx="8" fill="#dff1e6"/><text x="567" y="396" font-size="15">queue C</text><path d="M675 389h95m-13-11 13 11-13 11" fill="none" stroke="#65ae91" stroke-width="4"/><rect x="790" y="355" width="220" height="68" rx="8" fill="#18201c"/><text x="820" y="384" font-size="15" fill="#fff">스토리지 작업 진행</text><text x="820" y="407" font-size="13" fill="#b8d7c3">완료된 요청부터 회수</text><text x="70" y="525" font-size="15" fill="#6e7972">PostgreSQL 18 Release Notes의 AIO 설명을 바탕으로 재구성</text></g></svg>
