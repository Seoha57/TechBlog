<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">SPIRE 워크로드 신원 발급과 mTLS 통신</title><desc id="desc">SPIRE 서버에서 등록 정보를 관리하고 노드의 에이전트가 워크로드 증명을 거쳐 SVID를 제공한 뒤 두 워크로드가 상호 TLS 통신을 하는 구조</desc><rect width="1200" height="660" rx="36" fill="#f5faf6"/><text x="72" y="85" fill="#18201c" font-family="Arial, sans-serif" font-size="34" font-weight="700">워크로드가 이름을 주장하는 대신, 환경의 증거로 신원을 발급받는다</text><text x="72" y="126" fill="#6e7972" font-family="Arial, sans-serif" font-size="20">SPIRE Agent는 로컬 워크로드의 selector를 확인하고 해당 SVID를 Workload API로 제공한다.</text><rect x="430" y="170" width="340" height="112" rx="22" fill="#e3f2e6" stroke="#76b991" stroke-width="3"/><text x="472" y="218" fill="#18201c" font-family="Arial, sans-serif" font-size="28" font-weight="700">SPIRE Server</text><text x="472" y="253" fill="#3d7259" font-family="Arial, sans-serif" font-size="18">등록 항목 · CA · Trust Bundle</text><path d="M600 284v60" stroke="#6aa88b" stroke-width="5" stroke-dasharray="10 9"/><path d="m582 326 18 20 18-20" fill="none" stroke="#6aa88b" stroke-width="5"/><rect x="338" y="350" width="524" height="200" rx="28" fill="#fff" stroke="#b9d7c1" stroke-width="3"/><text x="370" y="392" fill="#6aa88b" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">KUBERNETES NODE / VM</text><rect x="506" y="415" width="190" height="90" rx="18" fill="#e8f4eb" stroke="#76b991" stroke-width="3"/><text x="538" y="454" fill="#18201c" font-family="Arial, sans-serif" font-size="24" font-weight="700">SPIRE Agent</text><text x="530" y="482" fill="#3d7259" font-family="Arial, sans-serif" font-size="15">PID · selector 검증</text><rect x="82" y="390" width="220" height="120" rx="20" fill="#fff7e8" stroke="#d9b36a" stroke-width="3"/><text x="112" y="437" fill="#5d4a1f" font-family="Arial, sans-serif" font-size="24" font-weight="700">orders-api</text><text x="112" y="472" fill="#756546" font-family="Arial, sans-serif" font-size="16">Workload API → SVID</text><rect x="898" y="390" width="220" height="120" rx="20" fill="#fff7e8" stroke="#d9b36a" stroke-width="3"/><text x="928" y="437" fill="#5d4a1f" font-family="Arial, sans-serif" font-size="24" font-weight="700">payments-api</text><text x="928" y="472" fill="#756546" font-family="Arial, sans-serif" font-size="16">Workload API → SVID</text><path d="M304 450h194" stroke="#6aa88b" stroke-width="5"/><path d="M698 450h198" stroke="#6aa88b" stroke-width="5"/><path d="m480 432 20 18-20 18M878 432l20 18-20 18" fill="none" stroke="#6aa88b" stroke-width="5"/><path d="M302 576h596" stroke="#539b74" stroke-width="6"/><path d="m552 558 18 18-18 18m78-36 18 18-18 18" fill="none" stroke="#539b74" stroke-width="5"/><text x="467" y="626" fill="#286242" font-family="Arial, sans-serif" font-size="23" font-weight="700">X.509-SVID 기반 mTLS</text><text x="72" y="600" fill="#6e7972" font-family="Arial, sans-serif" font-size="17">신원 확인 뒤에도 API·데이터 권한은 별도의 authorization 정책으로 제한해야 한다.</text></svg>
