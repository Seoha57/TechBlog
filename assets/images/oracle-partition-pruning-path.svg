<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Oracle 파티션 프루닝 구조</title><desc id="desc">SQL의 파티션 키 조건이 optimizer를 거쳐 필요한 월별 파티션만 읽고 나머지 파티션을 건너뛰는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8a5a1f"/></marker></defs><rect width="1100" height="480" rx="28" fill="#fdf8f1"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#4a2e0a">파티셔닝의 핵심은 테이블을 쪼개는 것이 아니라 읽지 않을 조각을 증명하는 것이다</text><text x="52" y="89" font-size="16" fill="#7a6040">파티션 키 조건이 SQL에 보여야 optimizer가 파티션을 제외할 수 있다</text><rect x="52" y="140" width="210" height="220" rx="20" fill="#fff" stroke="#d3a867" stroke-width="2"/><text x="157" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#4a2e0a">SQL</text><text x="157" y="214" text-anchor="middle" font-size="13" fill="#6b5030">WHERE order_date</text><text x="157" y="236" text-anchor="middle" font-size="13" fill="#6b5030">&gt;= DATE '2026-03-01'</text><text x="157" y="258" text-anchor="middle" font-size="13" fill="#6b5030">AND order_date</text><text x="157" y="280" text-anchor="middle" font-size="13" fill="#6b5030">&lt; DATE '2026-04-01'</text><text x="157" y="326" text-anchor="middle" font-size="12" fill="#8a7050">키에 함수를 씌우면 불리</text><line x1="262" y1="250" x2="318" y2="250" stroke="#8a5a1f" stroke-width="3" marker-end="url(#a)"/><rect x="320" y="140" width="210" height="220" rx="20" fill="#f6e6cc" stroke="#c9953f" stroke-width="2"/><text x="425" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#4a2e0a">Optimizer</text><text x="425" y="214" text-anchor="middle" font-size="13" fill="#6b5030">파티션 경계와</text><text x="425" y="236" text-anchor="middle" font-size="13" fill="#6b5030">조건 비교</text><text x="425" y="270" text-anchor="middle" font-size="13" fill="#6b5030">Pstart / Pstop 결정</text><text x="425" y="326" text-anchor="middle" font-size="12" fill="#8a7050">실행 계획에서 확인</text><line x1="530" y1="250" x2="586" y2="250" stroke="#8a5a1f" stroke-width="3" marker-end="url(#a)"/><rect x="588" y="120" width="460" height="260" rx="20" fill="#fff" stroke="#d3a867" stroke-width="2"/><text x="818" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#4a2e0a">ORDERS (월별 Range 파티션)</text><rect x="612" y="180" width="95" height="70" rx="10" fill="#eee" stroke="#bbb"/><text x="659" y="220" text-anchor="middle" font-size="13" fill="#999">2026-01</text><rect x="717" y="180" width="95" height="70" rx="10" fill="#eee" stroke="#bbb"/><text x="764" y="220" text-anchor="middle" font-size="13" fill="#999">2026-02</text><rect x="822" y="180" width="95" height="70" rx="10" fill="#f0b45a" stroke="#a8691a" stroke-width="3"/><text x="869" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#4a2e0a">2026-03</text><rect x="927" y="180" width="95" height="70" rx="10" fill="#eee" stroke="#bbb"/><text x="974" y="220" text-anchor="middle" font-size="13" fill="#999">2026-04</text><text x="818" y="285" text-anchor="middle" font-size="14" fill="#4a2e0a">읽는 파티션: 1개 / 건너뛴 파티션: 나머지</text><text x="818" y="315" text-anchor="middle" font-size="13" fill="#7a6040">오래된 파티션은 DROP·이동으로 한 번에 보관 정책 적용</text><text x="818" y="345" text-anchor="middle" font-size="13" fill="#7a6040">Local Index는 파티션 단위로 유지보수</text></g></svg>
