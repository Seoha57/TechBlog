<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400"><rect width="1200" height="400" rx="28" fill="#f3faf6"/><g font-family="Arial" fill="#14221d"><text x="70" y="70" font-size="28" font-weight="700">프레임워크를 실무 질문으로 연결하기</text><rect x="70" y="130" width="250" height="180" rx="20" fill="#fff" stroke="#a9d6c0" stroke-width="3"/><text x="105" y="195" font-size="22" font-weight="700">ITIL</text><text x="105" y="235" font-size="16" fill="#648076">장애·변경을 어떻게?</text><rect x="365" y="130" width="250" height="180" rx="20" fill="#e0f1e8" stroke="#a9d6c0" stroke-width="3"/><text x="400" y="195" font-size="22" font-weight="700">ISO 9001</text><text x="400" y="235" font-size="16" fill="#648076">품질을 어떻게 증명?</text><rect x="660" y="130" width="250" height="180" rx="20" fill="#fff" stroke="#a9d6c0" stroke-width="3"/><text x="695" y="195" font-size="22" font-weight="700">ISO 20000</text><text x="695" y="235" font-size="16" fill="#648076">서비스를 어떻게 관리?</text><rect x="955" y="130" width="175" height="180" rx="20" fill="#e0f1e8" stroke="#a9d6c0" stroke-width="3"/><text x="985" y="195" font-size="22" font-weight="700">CMMI</text><text x="985" y="235" font-size="16" fill="#648076">개선을 어떻게?</text></g></svg>
