<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">OpenAPI 명세를 중심으로 한 API 검증 흐름</title><desc id="desc">기획과 개발이 작성한 OpenAPI 명세를 린트와 계약 테스트, 소비자와 제공자 검증으로 연결하는 흐름</desc><rect width="1200" height="560" fill="#fbfcfa"/><g font-family="Arial, Pretendard, sans-serif"><text x="70" y="75" font-size="30" font-weight="700" fill="#18201c">명세를 먼저 합의하면, API 변경을 배포 전에 발견할 수 있습니다</text><text x="70" y="110" font-size="17" fill="#6e7972">문서가 아니라 검증 기준으로 OpenAPI를 사용하는 흐름입니다.</text><rect x="75" y="185" width="235" height="175" rx="20" fill="#fff" stroke="#c5decf" stroke-width="2"/><text x="108" y="240" font-size="21" font-weight="700" fill="#18201c">OpenAPI 명세</text><text x="108" y="274" font-size="15" fill="#607168">경로 · 요청 · 응답</text><text x="108" y="300" font-size="15" fill="#607168">상태 코드 · 예시</text><path d="M310 272h105m-16-12 16 12-16 12" fill="none" stroke="#65ae91" stroke-width="4"/><rect x="435" y="185" width="235" height="175" rx="20" fill="#e2f2e7"/><text x="468" y="240" font-size="21" font-weight="700" fill="#18201c">정적 검증</text><text x="468" y="274" font-size="15" fill="#4d6657">린트 · 형식 · 규칙</text><text x="468" y="300" font-size="15" fill="#4d6657">호환성 변경 탐지</text><path d="M670 272h105m-16-12 16 12-16 12" fill="none" stroke="#65ae91" stroke-width="4"/><rect x="795" y="185" width="310" height="175" rx="20" fill="#fff7ec" stroke="#e5c98e" stroke-width="2"/><text x="828" y="240" font-size="21" font-weight="700" fill="#18201c">실행 검증</text><text x="828" y="274" font-size="15" fill="#765d2e">요청·응답 계약 테스트</text><text x="828" y="300" font-size="15" fill="#765d2e">소비자·제공자 통합 확인</text><line x1="75" y1="425" x2="1105" y2="425" stroke="#dfe8e1" stroke-width="2"/><text x="75" y="475" font-size="18" font-weight="700" fill="#51705f">핵심: 명세 변경 → 자동 검사 → 리뷰 → 배포 순서로 고정한다</text></g></svg>
