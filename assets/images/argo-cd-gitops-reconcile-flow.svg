<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">Argo CD GitOps 비교·동기화 흐름</title><desc id="desc">개발자가 Git 저장소에 커밋하면 repo-server가 렌더링하고, application-controller가 클러스터의 live state와 비교해 Synced 또는 OutOfSync로 판정한 뒤 동기화하는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="460" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="58" font-size="28" font-weight="700" fill="#1a2f55">Git의 선언과 클러스터 상태를 계속 비교한다</text><text x="52" y="89" font-size="16" fill="#546a8c">Argo CD는 클러스터 안에서 저장소를 읽어 오는 pull 방식이다</text><rect x="52" y="140" width="200" height="120" rx="18" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="152" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2f55">Git 저장소</text><text x="152" y="210" text-anchor="middle" font-size="14" fill="#1a2f55">매니페스트 · 차트</text><text x="152" y="234" text-anchor="middle" font-size="14" fill="#546a8c">desired state</text><rect x="330" y="140" width="200" height="120" rx="18" fill="#dce6f7" stroke="#6f8cc0" stroke-width="2"/><text x="430" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2f55">repo-server</text><text x="430" y="210" text-anchor="middle" font-size="14" fill="#1a2f55">clone + 렌더링</text><text x="430" y="234" text-anchor="middle" font-size="14" fill="#546a8c">Helm · Kustomize</text><rect x="608" y="140" width="200" height="120" rx="18" fill="#dce6f7" stroke="#6f8cc0" stroke-width="2"/><text x="708" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2f55">application-</text><text x="708" y="204" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2f55">controller</text><text x="708" y="234" text-anchor="middle" font-size="14" fill="#546a8c">비교 · 동기화</text><rect x="886" y="140" width="170" height="120" rx="18" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="971" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#1a2f55">클러스터</text><text x="971" y="210" text-anchor="middle" font-size="14" fill="#1a2f55">API Server</text><text x="971" y="234" text-anchor="middle" font-size="14" fill="#546a8c">live state</text><path d="M252 200H326" stroke="#3b5f9a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M530 200H604" stroke="#3b5f9a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M808 180H882" stroke="#3b5f9a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M882 225H808" stroke="#3b5f9a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="845" y="170" text-anchor="middle" font-size="12" fill="#546a8c">적용</text><text x="845" y="245" text-anchor="middle" font-size="12" fill="#546a8c">관찰</text><text x="289" y="190" text-anchor="middle" font-size="12" fill="#546a8c">리비전</text><text x="567" y="190" text-anchor="middle" font-size="12" fill="#546a8c">최종 YAML</text><rect x="300" y="320" width="230" height="84" rx="16" fill="#e6f4ea" stroke="#5b9a6e" stroke-width="2"/><text x="415" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4d2e">Synced</text><text x="415" y="378" text-anchor="middle" font-size="14" fill="#1d4d2e">선언과 live state 일치</text><rect x="608" y="320" width="270" height="84" rx="16" fill="#fdecec" stroke="#c46a6a" stroke-width="2"/><text x="743" y="352" text-anchor="middle" font-size="18" font-weight="700" fill="#7a2020">OutOfSync</text><text x="743" y="378" text-anchor="middle" font-size="14" fill="#7a2020">Git 변경 또는 직접 수정 → sync</text><path d="M708 260V300H415V316" stroke="#3b5f9a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M708 300H743V316" stroke="#3b5f9a" stroke-width="2" fill="none" marker-end="url(#a)"/></g></svg>
