<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc"><title id="title">OWASP ZAP 동적 보안 스캔 흐름</title><desc id="desc">CI가 스테이징 환경을 띄우고 ZAP이 스파이더로 경로를 찾으며 패시브 스캔과 선택적 액티브 스캔을 수행한 뒤 알림을 규칙 파일로 분류해 종료 코드로 파이프라인을 통과 또는 실패시키는 구조</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#3b5f9a"/></marker></defs><rect width="1100" height="460" rx="28" fill="#f4f7fd"/><g font-family="sans-serif"><text x="52" y="52" font-size="25" font-weight="700" fill="#1a2f55">실행 중인 애플리케이션을 밖에서 두드려 보는 DAST 파이프라인</text>
<rect x="40" y="100" width="190" height="110" rx="14" fill="#dce6f7" stroke="#6f8cc0"/><text x="135" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">1. 배포</text><text x="135" y="168" text-anchor="middle" font-size="13" fill="#1a2f55">스테이징에 앱 기동</text><text x="135" y="190" text-anchor="middle" font-size="13" fill="#546a8c">테스트 데이터만 존재</text>
<rect x="270" y="100" width="190" height="110" rx="14" fill="#dce6f7" stroke="#6f8cc0"/><text x="365" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">2. 탐색</text><text x="365" y="168" text-anchor="middle" font-size="13" fill="#1a2f55">스파이더가 링크 수집</text><text x="365" y="190" text-anchor="middle" font-size="13" fill="#546a8c">또는 OpenAPI 정의 사용</text>
<rect x="500" y="100" width="190" height="110" rx="14" fill="#e3f0e0" stroke="#78a870"/><text x="595" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">3. 패시브 스캔</text><text x="595" y="168" text-anchor="middle" font-size="13" fill="#1a2f55">응답만 분석</text><text x="595" y="190" text-anchor="middle" font-size="13" fill="#546a8c">공격 요청을 보내지 않음</text>
<rect x="730" y="100" width="190" height="110" rx="14" fill="#fbe9e7" stroke="#d98b80"/><text x="825" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">4. 액티브 스캔</text><text x="825" y="168" text-anchor="middle" font-size="13" fill="#1a2f55">공격 페이로드 전송</text><text x="825" y="190" text-anchor="middle" font-size="13" fill="#9b3b30">허가된 격리 환경 한정</text>
<path d="M232 155 L266 155" stroke="#3b5f9a" stroke-width="2" marker-end="url(#a)"/><path d="M462 155 L496 155" stroke="#3b5f9a" stroke-width="2" marker-end="url(#a)"/><path d="M692 155 L726 155" stroke="#3b5f9a" stroke-width="2" marker-end="url(#a)"/>
<rect x="150" y="280" width="260" height="110" rx="14" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="280" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">5. 알림 분류</text><text x="280" y="344" text-anchor="middle" font-size="13" fill="#1a2f55">규칙 파일: FAIL / WARN / IGNORE</text><text x="280" y="368" text-anchor="middle" font-size="13" fill="#546a8c">오탐은 사유와 함께 IGNORE</text>
<rect x="470" y="280" width="260" height="110" rx="14" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="600" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">6. 리포트</text><text x="600" y="344" text-anchor="middle" font-size="13" fill="#1a2f55">HTML·JSON·Markdown</text><text x="600" y="368" text-anchor="middle" font-size="13" fill="#546a8c">CI 아티팩트로 보관</text>
<rect x="790" y="280" width="260" height="110" rx="14" fill="#fff" stroke="#8fa8d4" stroke-width="2"/><text x="920" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2f55">7. 종료 코드</text><text x="920" y="344" text-anchor="middle" font-size="13" fill="#1a2f55">0 통과 / 1 실패 / 2 경고</text><text x="920" y="368" text-anchor="middle" font-size="13" fill="#546a8c">파이프라인 게이트로 사용</text>
<path d="M825 214 L825 250 L280 250 L280 276" stroke="#3b5f9a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M595 214 L595 250" stroke="#3b5f9a" stroke-width="2" fill="none"/><path d="M412 335 L466 335" stroke="#3b5f9a" stroke-width="2" marker-end="url(#a)"/><path d="M732 335 L786 335" stroke="#3b5f9a" stroke-width="2" marker-end="url(#a)"/>
<text x="550" y="430" text-anchor="middle" font-size="14" fill="#546a8c">패시브 스캔만 쓰는 baseline은 3단계까지, 액티브 스캔은 별도 일정으로 분리하는 구성이 흔하다</text></g></svg>
