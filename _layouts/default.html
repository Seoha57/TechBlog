<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    {% seo %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/font.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/rounded.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/qa.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/code.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/post-fix.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/table.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/article-nav.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/ai.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">아직 운영 중입니다<span>.</span></a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/' | relative_url }}#articles">Articles</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <strong>아직 운영 중입니다.</strong>
      <span>QA · DBA · Infrastructure · AI</span>
    </footer>
  </body>
</html>
