---
layout: default
---
<article class="post-content">
  <header class="post-header">
    <div class="post-meta"><span>{{ page.categories | first | default: 'NOTE' }}</span><time>{{ page.date | date: '%Y.%m.%d' }}</time></div>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">{{ content }}</div>
</article>
