---
layout: default
---
<article id="article-top" class="post-content">
  <header class="post-header">
    <div class="post-meta"><span>{{ page.categories | first | default: 'NOTE' }}</span><time>{{ page.date | date: '%Y.%m.%d' }}</time></div>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">{{ content }}</div>
  <nav class="article-nav" aria-label="글 탐색">
    <a class="article-nav-home" href="{{ '/#articles' | relative_url }}">글 목록 보기 <span>↗</span></a>
    <div class="article-nav-links">
      {% if page.previous %}<a href="{{ page.previous.url | relative_url }}"><small>이전 글</small><strong>{{ page.previous.title }}</strong></a>{% endif %}
      {% if page.next %}<a href="{{ page.next.url | relative_url }}"><small>다음 글</small><strong>{{ page.next.title }}</strong></a>{% endif %}
    </div>
  </nav>
</article>
<nav class="floating-actions" aria-label="빠른 이동">
  <a href="{{ '/#articles' | relative_url }}">글 목록</a>
  <a href="#article-top" aria-label="글 맨 위로 이동">TOP <span aria-hidden="true">↑</span></a>
</nav>
